re o meio ambiente.", "os problemas ambientais atingem as nações ricas e pobres com a mesma intensidade.", "a prosperidade cresceu, mas a fome continua para milhões de pessoas em todo o mundo."], "pags": [4]}, {"id": "2022-2", "ano": 2022, "num": 2, "materia": "Português", "topico": "Interpretação e inferência (informação explícita e implícita)", "dif": "Fácil", "enun": "Segundo o Texto 1,", "alts": ["o uso da terra e dos oceanos apresenta grande sustentabilidade ambiental.", "a superação do declínio ambiental depende de ação coordenada por todos.", "as mudanças climáticas atuais garantem a superação do declínio ambiental.", "os impactos do declínio ambiental, no planeta, não poderão ser revertidos."], "pags": [4]}, {"id": "2022-3", "ano": 2022, "num": 3, "materia": "Português", "topico": "Propósito comunicativo, objetivo e tema do texto", "dif": "Fácil", "enun": "O objetivo principal do Texto 1 é", "alts": ["apresentar algumas conclusões do relatório do Programa das Nações Unidas para o Meio Ambiente.", "descrever os papéis de todos na sociedade e as transformações necessárias para um futuro sustentável.", "convencer os países ricos a colaborarem com os países em desenvolvimento em prol de um futuro sustentável.", "informar que a poluição do ar causa até 7 milhões de mortes prematuras por ano em todo o planeta."], "pags": [4]}, {"id": "2022-4", "ano": 2022, "num": 4, "materia": "Português", "topico": "Organização do texto e função de trecho", "dif": "Fácil", "enun": "O trecho destacado, logo abaixo do título do Texto 1, cumpre a função de", "alts": ["indicar dois argumentos importantes para a defesa do meio ambiente.", "chamar a atenção para dois temas importantes apresentados no texto.", "complementar as informações prestadas no texto.", "justificar por que a pesquisa do Pnuma foi feita. Considere a inserção do trecho no texto 1 para responder à questão. A NOVA PESQUISA descreve os papéis de todos na sociedade e as transformações necessárias para um futuro sustentável."], "pags": [4]}, {"id": "2022-5", "ano": 2022, "num": 5, "materia": "Português", "topico": "Coesão e coerência (referenciação e pronomes)", "dif": "Fácil", "enun": "A expressão A NOVA PESQUISA tem como referente", "alts": ["Pnuma.", "papéis.", "um novo relatório.", "transformações. EDITAL Nº 084/2021 – IFMA Considere o trecho para responder às questões 6 e 7. Nos últimos 50 anos, a economia global cresceu quase cinco vezes, em grande parte DEVIDO A uma triplicação na extração de recursos naturais e energia QUE impulsionou o crescimento da produção e do consumo."], "pags": [4, 5]}, {"id": "2022-6", "ano": 2022, "num": 6, "materia": "Português", "topico": "Conjunções e relações de sentido (conectivos)", "dif": "Média", "enun": "A expressão DEVIDO A estabelece com a oração seguinte uma relação de", "alts": ["causa.", "tempo.", "oposição.", "concessão."], "pags": [5]}, {"id": "2022-7", "ano": 2022, "num": 7, "materia": "Português", "topico": "Classes de palavras (que, advérbio, substantivo, adjetivo)", "dif": "Média", "enun": "O vocábulo QUE é", "alts": ["advérbio de intensidade que acentua a magnitude do crescimento da economia global.", "pronome relativo que retoma a expressão “triplificação na extração de recursos naturais e energia”.", "partícula que dá realce à expressão “extração de recursos naturais e energia”.", "conjunção integrante que liga o termo “energia” à oração que o sucede. Considere o trecho para responder às questões 8, 9, 10 e 11. Um novo relatório do Programa das Nações Unidas para o Meio Ambiente, (1) PNUMA, (2) diz que as crises da mudança climática, perda de biodiversidade e poluição são interligadas e colocam sob “(3) risco inaceitável” (4) o BEM-ESTAR das gerações atual e futuras."], "pags": [5]}, {"id": "2022-8", "ano": 2022, "num": 8, "materia": "Português", "topico": "Sintaxe: período composto, orações e termos", "dif": "Média", "enun": "O trecho constitui-se de um período composto por", "alts": ["coordenação e subordinação com duas orações.", "subordinação e coordenação com três orações.", "subordinação com três orações.", "coordenação com duas orações."], "pags": [5]}, {"id": "2022-9", "ano": 2022, "num": 9, "materia": "Português", "topico": "Pontuação (vírgula e aspas)", "dif": "Média", "enun": "As vírgulas antes (1) e depois (2) de PNUMA separam um(a)", "alts": ["adjunto adnominal.", "adjunto adverbial.", "aposto explicativo.", "oração adjetiva. EDITAL Nº 084/2021 – IFMA"], "pags": [5, 6]}, {"id": "2022-10", "ano": 2022, "num": 10, "materia": "Português", "topico": "Pontuação (vírgula e aspas)", "dif": "Média", "enun": "As aspas usadas no trecho e indicadas pelos números (3) e (4)", "alts": ["indicam uma expressão irônica.", "destacam uma citação indireta.", "enfatizam a ideia da expressão.", "marcam um neologismo."], "pags": [6]}, {"id": "2022-11", "ano": 2022, "num": 11, "materia": "Português", "topico": "Formação de palavras", "dif": "Difícil", "enun": "O processo de formação da palavra BEM-ESTAR é", "alts": ["aglutinação.", "prefixação.", "sufixação.", "justaposição. Considere o trecho para responder à questão 12. Segundo o Pnuma, “garantir que os investimentos desencadeados pela crise apoiem mudanças transformadoras é a CHAVE para alcançar a sustentabilidade rapidamente.”"], "pags": [6]}, {"id": "2022-12", "ano": 2022, "num": 12, "materia": "Português", "topico": "Denotação, conotação e figuras de linguagem", "dif": "Difícil", "enun": "O vocábulo CHAVE foi usado", "alts": ["denotativamente e significa solução.", "conotativamente e significa solução.", "conotativamente e significa posse.", "denotavivamente e significa posse."], "pags": [6]}, {"id": "2022-13", "ano": 2022, "num": 13, "materia": "Português", "topico": "Propósito comunicativo, objetivo e tema do texto", "dif": "Difícil", "enun": "O propósito comunicativo prioritário do Texto 2 é", "alts": ["criticar a falta de consciência ambiental diante do declínio da natureza.", "explicar o aquecimento global a partir do descontrole climático no planeta.", "informar sobre o declínio ambiental do planeta a partir dos distúrbios climáticos.", "refletir sobre o relacionamento amigável entre pai e filho diante do declínio ambiental."], "pags": [6]}, {"id": "2022-14", "ano": 2022, "num": 14, "materia": "Português", "topico": "Leitura de imagem, gráfico, charge e infográfico", "dif": "Difícil", "enun": "A leitura do Texto 2 permite inferir que", "alts": ["as mudanças climáticas são menos percebidas no mar.", "os pinguins são os animais que mais têm sofrido com as mudanças climáticas.", "os jovens não entendem a relação entre suas ações e as mudanças climáticas.", "as ações humanas têm provocado mudanças climáticas."], "pags": [6]}, {"id": "2022-15", "ano": 2022, "num": 15, "materia": "Português", "topico": "Gêneros textuais", "dif": "Difícil", "enun": "Os textos 1 e 2 desta prova, respectivamente, são", "alts": ["notícia e cartum.", "editorial e quadrinhos.", "entrevista e cartaz.", "reportagem e charge. EDITAL Nº 084/2021 – IFMA"], "pags": [6, 7]}, {"id": "2022-16", "ano": 2022, "num": 16, "materia": "Matemática", "topico": "Juros simples", "dif": "Fácil", "enun": "Segundo o Texto 1, os países em desenvolvimento precisam de financiamentos a juros baixos para\nenfrentarem os desafios ambientais. Pensando nesse apoio, um banco de desenvolvimento oferece\npacotes de ajuda financeira em bilhões de dólares para ações ambientais nesses países a uma taxa de\njuros simples anual de 3%. Se uma nação pegar um empréstimo de 10 bilhões, para pagar após cinco\nanos, o montante a ser pago será", "alts": ["12,5 bilhões.", "15 bilhões.", "11,5 bilhões.", "14 bilhões."], "pags": [7]}, {"id": "2022-17", "ano": 2022, "num": 17, "materia": "Matemática", "topico": "Estatística e leitura de dados (média, moda, mediana, gráficos)", "dif": "Fácil", "enun": "A análise do Gráfico 1 permite afirmar que", "alts": ["os EUA emitem mais dióxido de carbono que todos os demais países listados abaixo dele no gráfico juntos.", "a China emite menos dióxido de carbono que todos os demais países listados no gráfico juntos.", "a UE emite três vezes mais dióxido de carbono que o Japão.", "a Índia emite cinquenta por cento menos dióxido de carbono que a UE. Gráfico 1 Disponível em:https://www.terra.com.br/noticias/ciencia/aquecimento- global-7-graficos-que-mostram-em-que-ponto- estamos,b0d136f8e78c7c4977983ea5ca642088qnt0p4bq.html Acesso em 22 nov. 2021. EDITAL Nº 084/2021 – IFMA"], "pags": [7, 8]}, {"id": "2022-18", "ano": 2022, "num": 18, "materia": "Matemática", "topico": "Círculo (área e comprimento)", "dif": "Fácil", "enun": "Para uma campanha de conscientização sobre as mudanças climáticas, uma ONG confeccionou bottons,\nfeitos com material reciclado, em formato circular, com 4cm de diâmetro. Se 1 cm 2 do botton tem massa\nde 1g e foram confeccionados 1.000.000 bottons, a massa total de material reciclado aproveitada na\nconfecção dos bottons, considerando 𝜋 = 3, foi de", "alts": ["36.000 kg.", "1.200 kg.", "12.000 kg.", "3.600 kg."], "pags": [8]}, {"id": "2022-19", "ano": 2022, "num": 19, "materia": "Matemática", "topico": "Volume do bloco retangular", "dif": "Fácil", "enun": "Para incentivar a discussão sobre o efeito estufa e as mudanças climáticas, um professor produziu uma\nmaquete retratando um ambiente afetado pela poluição. Sabendo que a maquete foi construída em um\nrecipiente em formato de paralelepípedo reto-retângulo, com 1,2m de comprimento, 0,6m de largura e\n0,5m de altura, a capacidade da maquete, em litros, é de", "alts": ["720.", "360.", "72.", "36."], "pags": [8]}, {"id": "2022-20", "ano": 2022, "num": 20, "materia": "Matemática", "topico": "Múltiplos e divisores (MMC, MDC, divisibilidade, fatores primos)", "dif": "Fácil", "enun": "Na tentativa de conscientizar a população sobre as mudanças climáticas e a necessidade de um consumo\nmais sustentável, o governo de um país decidiu veicular uma propaganda nas 3 principais redes de\ntelevisão do país. Na primeira rede, a propaganda ocorre a cada 3 horas; na segunda, a cada 4 horas; e,\nna terceira, a cada 5 horas. Se as propagandas, nas 3 emissoras, foram veiculadas pela primeira vez no\nmesmo instante, a próxima vez que elas serão transmitidas, concomitantemente, pelas 3 emissoras\nocorrerá após", "alts": ["50 horas.", "30 horas.", "60 horas.", "40 horas."], "pags": [8]}, {"id": "2022-21", "ano": 2022, "num": 21, "materia": "Matemática", "topico": "Divisão proporcional", "dif": "Média", "enun": "Um prêmio de 60 bilhões de dólares será distribuído entre três nações em desenvolvimento que\nconseguiram reduzir suas emissões de gases do efeito estufa. Sabe-se que a distribuição ocorrerá de\nforma proporcional ao percentual das emissões que cada nação conseguiu reduzir. A primeira nação\nconseguiu reduzir as emissões em 50%; a segunda, em 40%; e a terceira, em 30%. O valor recebido pela\nnação que reduziu as emissões em 40% foi", "alts": ["15 bilhões.", "25 bilhões.", "30 bilhões.", "20 bilhões. EDITAL Nº 084/2021 – IFMA"], "pags": [8, 9]}, {"id": "2022-22", "ano": 2022, "num": 22, "materia": "Matemática", "topico": "Função do 1º grau (noções de função)", "dif": "Média", "enun": "Um grande empresário, preocupado com o aquecimento global, ofereceu a seu país um prêmio de 100\nmilhões de dólares, caso ele cumprisse a meta de redução de emissão de gases do efeito estufa\nestabelecida para o ano de 2022, em uma reunião global, sobre mudanças climáticas; e mais 10 milhões\nde dólares para cada ano subsequente em que o país alcançasse a meta. A função que representa o\nvalor y que esse país poderá arrecadar, após x anos será", "alts": ["𝑦 = 10.000.000𝑥 + 100.000.000.", "𝑦 = 10.000.000𝑥 + 80.000.000.", "𝑦 = 110.000.000𝑥.", "𝑦 = 80.000.000𝑥."], "pags": [9]}, {"id": "2022-23", "ano": 2022, "num": 23, "materia": "Matemática", "topico": "Equação do 1º grau", "dif": "Média", "enun": "O aumento da temperatura do planeta resulta em mortes causadas por ondas de calor extremas, como a que\natingiu a França, em 2019, e matou cerca de x pessoas. Sabe-se que 50% delas, algo em torno de 750 pessoas,\ntinha mais de 75 anos. A equação do primeiro grau que determina o número x de pessoas mortas é dada por\n\n𝑥", "alts": [" − 750 = 0.", "2𝑥 − 750 = 0. 𝑥", "+ 2 = 0. 750 𝑥", "− 750 = 0. Leia o trecho a seguir, retirado do Texto 1, para responder às questões 24, 25 e 26. A população global duplicou para 7,8 bilhões. A prosperidade também dobrou, mas cerca de 1,3 bilhão de pessoas continuam na pobreza e 700 milhões passam fome."], "pags": [9]}, {"id": "2022-24", "ano": 2022, "num": 24, "materia": "Matemática", "topico": "Porcentagem", "dif": "Média", "enun": "O percentual de pessoas que continua na pobreza, aproximadamente, corresponde a", "alts": ["18%.", "15%.", "17%.", "21%."], "pags": [9]}, {"id": "2022-25", "ano": 2022, "num": 25, "materia": "Matemática", "topico": "Notação científica", "dif": "Média", "enun": "A representação, em notação científica, da quantidade de pessoas que não está na linha de pobreza é\ndada por", "alts": ["7,0.1011.", "6,5.109.", "6,5.1010.", "7,0.109. EDITAL Nº 084/2021 – IFMA"], "pags": [9, 10]}, {"id": "2022-26", "ano": 2022, "num": 26, "materia": "Matemática", "topico": "Razões e proporções (razão, taxa, densidade, velocidade)", "dif": "Difícil", "enun": "A razão entre o total de pessoas que está na pobreza e a população global é de", "alts": [".", ".", "6.", "8."], "pags": [10]}, {"id": "2022-27", "ano": 2022, "num": 27, "materia": "Matemática", "topico": "Probabilidade", "dif": "Difícil", "enun": "Um professor de Geografia pretende trabalhar os quatro temas extraídos do Texto 1: onda de calor,\ninundações, secas e poluição. Para escolher com qual dos assuntos iniciaria a sequência de aulas, o\nprofessor distribuiu os nomes dos temas em diferentes pedaços de papel, colocou-os em uma urna e, de\nforma aleatória, retirou um papel. A probabilidade de ter sido retirado o papel com o tema poluição é de", "alts": ["0,33.", "0,50.", "0,25.", "0,41."], "pags": [10]}, {"id": "2022-28", "ano": 2022, "num": 28, "materia": "Matemática", "topico": "Sequências e raciocínio aritmético", "dif": "Difícil", "enun": "De acordo com o Texto 1, nos últimos 50 anos, a população global duplicou, chegando atualmente a um\ntotal de 7,8 bilhões de pessoas. Supondo que, a partir de agora, a cada 30 anos, haverá um aumento da\npopulação mundial em 1,5 bilhão de pessoas; em 2081, a população global, aproximadamente, será de", "alts": ["8,3 bilhões.", "13,8 bilhões.", "15,4 bilhões.", "10,8 bilhões. EDITAL Nº 084/2021 – IFMA Considere o trecho abaixo e a Figura 1 para responder às questões 29 e 30. A Figura 1 mostra uma área de desmatamento na região Amazônica em forma de um triângulo retângulo. Sabe-se que as medidas ̅̅̅̅ ̅̅̅̅ são, respectivamente, 8 e 10 metros. 𝑨𝑩 e 𝑩𝑪"], "pags": [10, 11]}, {"id": "2022-29", "ano": 2022, "num": 29, "materia": "Matemática", "topico": "Teorema de Pitágoras", "dif": "Difícil", "enun": "A medida, em metros, do segmento ̅̅̅̅\n𝑨𝑪 é", "alts": ["13.", "9.", "6.", "12."], "pags": [11]}, {"id": "2022-30", "ano": 2022, "num": 30, "materia": "Matemática", "topico": "Área de polígonos", "dif": "Difícil", "enun": "A área, em m2, da região desmatada é", "alts": ["30.", "27.", "40.", "24."], "pags": [11]}, {"id": "2023-1", "ano": 2023, "num": 1, "materia": "Português", "topico": "Interpretação e inferência (informação explícita e implícita)", "dif": "Fácil", "enun": "A leitura do Texto 1 nos permite afirmar que", "alts": ["os agressores, geralmente, são homens negros e pobres.", "as mulheres brancas conseguem encaminhamentos concretos relativos à proteção.", "a violência de gênero atinge mulheres independentemente da raça ou classe social.", "o aumento do número de casos de feminicídio fará com que o estado tome providências."], "pags": [4]}, {"id": "2023-2", "ano": 2023, "num": 2, "materia": "Português", "topico": "Propósito comunicativo, objetivo e tema do texto", "dif": "Fácil", "enun": "A intencionalidade principal do Texto 1 é", "alts": ["informar às mulheres quais as instâncias estatais de proteção.", "apoiar o Coletivo de Mulheres Negras Baobá.", "apresentar casos de feminicídio no Distrito Federal.", "denunciar o feminicídio contra as mulheres negras. Leia o trecho a seguir para responder às questões de 03 a 08. Soma-se a isso o descaso do governo, [1] que não diminui por falta de políticas públicas eficazes, [2] a demanda entre a prestação de serviços públicos de atenção à mulher e a operacionalidade desses serviços."], "pags": [4]}, {"id": "2023-3", "ano": 2023, "num": 3, "materia": "Português", "topico": "Coesão e coerência (referenciação e pronomes)", "dif": "Fácil", "enun": "Considerando a inserção do trecho no Texto 1, o vocábulo ISSO refere-se", "alts": ["à falta de articulação entre o Sistema de Justiça Criminal, o Sistema de Segurança Pública e o Judiciário.", "à necessidade de qualificação do Sistema de Justiça Criminal, do Sistema de Segurança Pública e do Judiciário.", "ao fato de as pessoas negras serem vistas pelo Judiciário como mais predispostas ao crime.", "ao descaso do governo que não tem políticas públicas para as mulheres negras, especialmente as meninas."], "pags": [4]}, {"id": "2023-4", "ano": 2023, "num": 4, "materia": "Português", "topico": "Classes de palavras (que, advérbio, substantivo, adjetivo)", "dif": "Fácil", "enun": "A expressão que, no trecho, tem valor de adjetivo é", "alts": ["à mulher.", "o descaso.", "do governo.", "de políticas públicas."], "pags": [4]}, {"id": "2023-5", "ano": 2023, "num": 5, "materia": "Português", "topico": "Pontuação (vírgula e aspas)", "dif": "Fácil", "enun": "As vírgulas assinaladas no trecho separam", "alts": ["um aposto explicativo.", "orações coordenadas.", "itens de uma enumeração.", "uma oração subordinada adjetiva. EDITAL Nº 89/2022 – IFMA"], "pags": [4, 5]}, {"id": "2023-6", "ano": 2023, "num": 6, "materia": "Português", "topico": "Conjunções e relações de sentido (conectivos)", "dif": "Média", "enun": "O vocábulo POR pode ser substituído pela expressão", "alts": ["devido à.", "em atenção à.", "a pretexto da.", "com o auxílio da."], "pags": [5]}, {"id": "2023-7", "ano": 2023, "num": 7, "materia": "Português", "topico": "Sintaxe: período composto, orações e termos", "dif": "Média", "enun": "No trecho, tem-se", "alts": ["uma oração coordenada e uma subordinada.", "uma oração principal e uma subordinada.", "duas orações coordenadas.", "duas orações subordinadas."], "pags": [5]}, {"id": "2023-8", "ano": 2023, "num": 8, "materia": "Português", "topico": "Organização do texto e função de trecho", "dif": "Média", "enun": "Considerando sua inserção no Texto 1, o trecho", "alts": ["explicita o significado da expressão “descaso do governo”.", "acrescenta um contra-argumento ao que vinha sendo desenvolvido.", "fundamenta a falta de articulação entre os sistemas estatais de proteção à mulher.", "acrescenta exemplos de problemas estatais para atender às mulheres vítimas de feminicídio. Leia o trecho a seguir para responder às questões 09, 10 e 11. O contexto da pandemia agravou a situação, que já não nos era favorável, com a vulnerabilização, o empobrecimento, o recrudescimento do racismo e do machismo frente à Covid-19."], "pags": [5]}, {"id": "2023-9", "ano": 2023, "num": 9, "materia": "Português", "topico": "Interpretação e inferência (informação explícita e implícita)", "dif": "Média", "enun": "O trecho permite afirmar que", "alts": ["a situação relativa ao feminicídio já era grave antes da pandemia.", "o feminicídio, o racismo e o machismo são reflexos da pandemia.", "a pandemia gerou o feminicídio, o racismo e o machismo.", "o empobrecimento agravou o racismo e o machismo."], "pags": [5]}, {"id": "2023-10", "ano": 2023, "num": 10, "materia": "Português", "topico": "Léxico: sinônimos, antônimos, parônimos e homônimos", "dif": "Média", "enun": "O vocábulo RECRUDESCIMENTO pode ser substituído por", "alts": ["difusão.", "aumento.", "acréscimo.", "desdobramento."], "pags": [5]}, {"id": "2023-11", "ano": 2023, "num": 11, "materia": "Português", "topico": "Formação de palavras", "dif": "Difícil", "enun": "O vocábulo EMPOBRECIMENTO é formado por", "alts": ["sufixação.", "prefixação.", "parassíntese.", "prefixação e sufixação. EDITAL Nº 89/2022 – IFMA"], "pags": [5, 6]}, {"id": "2023-12", "ano": 2023, "num": 12, "materia": "Português", "topico": "Gêneros textuais", "dif": "Difícil", "enun": "Quanto ao gênero textual, o Texto 1 configura-se como", "alts": ["notícia.", "editorial.", "reportagem.", "artigo de opinião"], "pags": [6]}, {"id": "2023-13", "ano": 2023, "num": 13, "materia": "Português", "topico": "Leitura de imagem, gráfico, charge e infográfico", "dif": "Difícil", "enun": "De acordo com o Texto 2, na pandemia,", "alts": ["o maior fator de vulnerabilidade à violência foi a dificuldade de encontrar apoio de outras pessoas.", "o terceiro maior fator de vulnerabilidade à violência foi o fechamento das Delegacias da Mulher.", "o segundo maior fator de vulnerabilidade à violência foi a maior convivência com o agressor.", "o principal fator de vulnerabilidade à violência foi a submissão da mulher ao agressor."], "pags": [6]}, {"id": "2023-14", "ano": 2023, "num": 14, "materia": "Português", "topico": "Leitura de imagem, gráfico, charge e infográfico", "dif": "Difícil", "enun": "A leitura da linguagem não verbal no Texto 3, originalmente em preto e branco, permite afirmar que", "alts": ["as mulheres são vítimas de violência pelo fato de serem mulheres.", "as mulheres que são assediadas terminam morrendo de forma violenta.", "as mulheres que usam saia curta estão mais propensas a serem assediadas.", "as mulheres negras estão mais propensas a serem assediadas porque são mais pobres."], "pags": [6]}, {"id": "2023-15", "ano": 2023, "num": 15, "materia": "Português", "topico": "Comparação entre textos e intertextualidade", "dif": "Difícil", "enun": "Os textos 1, 2 e 3 têm em comum", "alts": ["a temática.", "o tipo textual.", "o registro coloquial.", "a linguagem conotativa. EDITAL Nº 89/2022 – IFMA"], "pags": [6, 7]}, {"id": "2023-16", "ano": 2023, "num": 16, "materia": "Matemática", "topico": "Porcentagem", "dif": "Fácil", "enun": "Segundo o Texto 1, cerca de 79% das 90 vítimas entre tentativas e feminicídios consumados no DF,\nentre 2019 e 2020, tiveram como vítimas mulheres negras. O total de mulheres negras que foram vítimas\nfoi", "alts": ["69.", "67.", "71", "73."], "pags": [7]}, {"id": "2023-17", "ano": 2023, "num": 17, "materia": "Matemática", "topico": "Sistema métrico e unidades de medida (inclui tempo)", "dif": "Fácil", "enun": "Se a CPI do feminicídio citada no Texto 01 realizou, em média, duas sessões de 90min durante 18 dos\nmeses em que a CPI esteve ativa, o total de horas que os parlamentares nomeados para a comissão\ndedicaram à CPI foi", "alts": ["55.", "54.", "53.", "52."], "pags": [7]}, {"id": "2023-18", "ano": 2023, "num": 18, "materia": "Matemática", "topico": "Razões e proporções (razão, taxa, densidade, velocidade)", "dif": "Fácil", "enun": "Sabendo que a taxa de mortalidade por feminicídio no ano de 2021 foi de 1,22 mortes para cada 100 mil\nmulheres, uma razão que pode representar essa taxa é", "alts": [". 5 000 000", ". 500 000", ". 1 000 000", ". 1 000 000"], "pags": [7]}, {"id": "2023-19", "ano": 2023, "num": 19, "materia": "Matemática", "topico": "Notação científica", "dif": "Fácil", "enun": "Um levantamento feito por um banco de dados global entre 2000 e 2019 estimou que 27% das mulheres\nde 15 a 49 anos sofreram algum tipo de violência de seus parceiros. Em uma cidade com 8 000 000 de\nmulheres de 15 a 49 anos, se a estimativa do levantamento global se mantiver, o número esperado de\nmulheres que sofrerão algum tipo de violência, em notação científica é", "alts": ["2,16 ⋅ 106 .", "2,16 ⋅ 105 .", "2,7 ⋅ 106 .", "2,7 ⋅ 105 . EDITAL Nº 89/2022 – IFMA"], "pags": [7, 8]}, {"id": "2023-20", "ano": 2023, "num": 20, "materia": "Matemática", "topico": "Função do 1º grau (noções de função)", "dif": "Fácil", "enun": "Em uma cidade, o tempo (T) de resposta a uma ligação telefônica de emergência para a polícia, em\nminutos, é dada pela função T(x) = 2x + 5, onde x representa a distância, em quilômetros, da viatura\npolicial ao local da ocorrência. Se uma emergência ocorreu a 12 km de uma viatura, o tempo de resposta\na essa emergência foi de", "alts": ["28 minutos.", "30 minutos.", "31 minutos.", "29 minutos."], "pags": [8]}, {"id": "2023-21", "ano": 2023, "num": 21, "materia": "Matemática", "topico": "Teorema de Pitágoras", "dif": "Média", "enun": "Após uma denúncia de tentativa de feminicídio, a justiça determinou que o agressor não poderia ficar a\nmenos de 5,2 km da vítima que sofreu a agressão. Se a vítima se encontra 3 km ao sul de uma biblioteca\nda cidade e o agressor se encontra a 4 km a oeste dessa mesma biblioteca, então", "alts": ["a determinação judicial está sendo cumprida, pois o agressor está a 5,5 km da vítima.", "a determinação judicial está sendo descumprida, pois o agressor está a 5 km da vítima.", "a determinação judicial está sendo cumprida, pois o agressor está a 6 km da vítima.", "a determinação judicial está sendo descumprida, pois o agressor está a 4,5 km da vítima."], "pags": [8]}, {"id": "2023-22", "ano": 2023, "num": 22, "materia": "Matemática", "topico": "Juros simples", "dif": "Média", "enun": "O governo de uma cidade concedeu empréstimos para que vítimas de tentativa de feminicídio pudessem\nrecomeçar suas vidas longe dos agressores. Se os empréstimos eram de R$ 10.000,00 a uma taxa de\njuros simples de 0,1% ao mês e com prazo de pagamento de 60 meses, o montante a ser pago ao final\ndo prazo será de", "alts": ["R$ 10.600,00.", "R$ 12.000,00.", "R$ 11.600,00.", "R$ 13.000,00."], "pags": [8]}, {"id": "2023-23", "ano": 2023, "num": 23, "materia": "Matemática", "topico": "Área de polígonos", "dif": "Média", "enun": "Uma manifestação repudiando a violência contra as mulheres foi realizada em uma praça, construída no\nformato pas)", "dif": "Média", "enun": "Quanto ao uso das vírgulas marcadas por (1) e (3), é correto afirmar que", "alts": ["isolam adjunto adverbial.", "isolam um adjunto adnominal.", "separam expressão com função de vocativo.", "separam uma expressão com função de aposto."], "pags": [4]}, {"id": "2024-8", "ano": 2024, "num": 8, "materia": "Português", "topico": "Interpretação e inferência (informação explícita e implícita)", "dif": "Média", "enun": "O uso do vocábulo ALIADA (4) deixa implícita a informação de que a tecnologia", "alts": ["contribui para o crescimento econômico das empresas.", "garante o desenvolvimento sustentável e os lucros das empresas.", "contribui com a automação dos serviços e com o aumento do desemprego.", "mudou as relações de trabalho nas empresas, informatizando os serviços. EDITAL Nº 115/2023 – IFMA"], "pags": [4, 5]}, {"id": "2024-9", "ano": 2024, "num": 9, "materia": "Português", "topico": "Classes de palavras (que, advérbio, substantivo, adjetivo)", "dif": "Média", "enun": "Nas ocorrências (5) e (6), o elemento linguístico QUE, respectivamente, tem valor de", "alts": ["pronome e conjunção.", "conjunção e conjunção.", "preposição e interjeição.", "substantivo e advérbio."], "pags": [5]}, {"id": "2024-10", "ano": 2024, "num": 10, "materia": "Português", "topico": "Pontuação (vírgula e aspas)", "dif": "Média", "enun": "Em “CRESCIMENTO CONSIDERÁVEL” (7), as aspas foram usadas para", "alts": ["marcar uma informação irônica.", "demarcar uma citação indireta.", "demarcar uma citação direta.", "enfatizar uma informação importante."], "pags": [5]}, {"id": "2024-11", "ano": 2024, "num": 11, "materia": "Português", "topico": "Conjunções e relações de sentido (conectivos)", "dif": "Difícil", "enun": "O elemento linguístico UMA VEZ QUE (8) introduz uma ideia de", "alts": ["causa em relação a algo que já foi discutido no texto.", "concessão em relação a algo que ainda será dito no texto.", "conclusão em relação às ideias discutidas ao longo do texto.", "consequência das ideias apresentadas ao longo do texto."], "pags": [5]}, {"id": "2024-12", "ano": 2024, "num": 12, "materia": "Português", "topico": "Leitura de imagem, gráfico, charge e infográfico", "dif": "Difícil", "enun": "De acordo com o Texto 2, é correto afirmar que", "alts": ["possivelmente, o ChatGPT resolverá os problemas de escrita na escola", "historicamente, o ChatGPT é a plataforma que se desenvolveu mais rápido.", "atualmente, a Inteligência Artificial simplifica os problemas da humanidade.", "futuramente, a humanidade não precisará mais da Inteligência Artificial."], "pags": [5]}, {"id": "2024-13", "ano": 2024, "num": 13, "materia": "Português", "topico": "Leitura de imagem, gráfico, charge e infográfico", "dif": "Difícil", "enun": "Sobre o Texto 3, é correto afirmar que", "alts": ["a maioria dos brasileiros afirmou já usar a Inteligência Artificial.", "a confiança dos brasileiros na Inteligência Artificial é a maior do mundo.", "o Brasil é um dos países onde a tecnologia tem um alto índice de aceitação.", "o Brasil é um dos quatro países que mais produzem tecnologia no mundo."], "pags": [5]}, {"id": "2024-14", "ano": 2024, "num": 14, "materia": "Português", "topico": "Gêneros textuais", "dif": "Difícil", "enun": "Quanto à configuração genérica, os textos 2 e 3, respectivamente, são", "alts": ["tirinha e tabela.", "anedota e tabela.", "charge e infográfico", "cartum e infográfico."], "pags": [5]}, {"id": "2024-15", "ano": 2024, "num": 15, "materia": "Português", "topico": "Comparação entre textos e intertextualidade", "dif": "Difícil", "enun": "Os textos 1, 2 e 3 apresentam em comum o", "alts": ["tipo textual.", "gênero textual.", "registro informal.", "recorte temático. EDITAL Nº 115/2023 – IFMA"], "pags": [5, 6]}, {"id": "2024-16", "ano": 2024, "num": 16, "materia": "Matemática", "topico": "Porcentagem", "dif": "Fácil", "enun": "O Texto 1 mostra que 41% das empresas brasileiras utilizam alguma forma de Inteligência Artificial em\nseu dia a dia. Cons uação do 2º grau", "dif": "Média", "enun": "Para a construção de uma microempresa de treinamento em programas e recursos de Inteligência\nArtificial, foi utilizado um terreno retangular, cujo comprimento é de 5 m maior do que a largura e a área\nigual a 300 m2. A soma dos lados desse terreno retangular é", "alts": ["70 m.", "60 m.", "54 m.", "72 m."], "pags": [8]}, {"id": "2024-26", "ano": 2024, "num": 26, "materia": "Matemática", "topico": "Teorema de Pitágoras", "dif": "Difícil", "enun": "Sabendo que as medidas dos lados de um triângulo retângulo podem ser representadas por x, x+5 e 25\n(sendo esse último referente ao maior lado), o produto dos valores dos lados desse triângulo é de", "alts": ["6.000.", "7.500.", "9.000.", "4.500."], "pags": [8]}, {"id": "2024-27", "ano": 2024, "num": 27, "materia": "Matemática", "topico": "Regra de três (direta e inversa)", "dif": "Difícil", "enun": "Um jovem estudante pretende ir ao Vale do Silício, localizado nos Estados Unidos, para fazer um curso\nsobre Inteligência Artificial. Contudo, as distâncias nas estradas do país são marcadas em milhas. Como\nele está acostumado a utilizar os valores em quilômetros e quer entender melhor as distâncias locais,\nanalisa uma placa, indicando que a cidade aonde ele deseja chegar, está a 92 milhas de distância.\nSabendo que 1 quilômetro é equivalente a cerca de 0,62 milhas, é correto afirmar que a distância a ser\npercorrida por ele, em quilômetros, aproximadamente, é de", "alts": ["155.", "132.", "126.", "148."], "pags": [8]}, {"id": "2024-28", "ano": 2024, "num": 28, "materia": "Matemática", "topico": "Juros simples", "dif": "Difícil", "enun": "Para empreender, no ramo de Inteligência Artificial, um recém-formado na área de TI (Tecnologia da\nInformação) pretende adquirir um empréstimo com um amigo. A condição acordada entre eles garantiu\num valor de 25 mil reais, valor a ser pago ao final de dois anos, com taxa de juros simples de 1% ano\nmês. Desse modo, ao final desse tempo, ele terá pago um valor total de", "alts": ["R$ 30.000,00.", "R$ 31.000,00.", "R$ 29.000,00.", "R$ 28.000,00."], "pags": [8]}, {"id": "2024-29", "ano": 2024, "num": 29, "materia": "Matemática", "topico": "Porcentagem", "dif": "Difícil", "enun": "Segundo o Texto 1, os investimentos em Inteligência Artificial aumentaram 28% entre 2021 e 2022. Esse\npercentual de 28%, na forma de fração, pode ser representado como", "alts": ["7/25.", "7/20.", "13/21.", "1/4. EDITAL Nº 115/2023 – IFMA"], "pags": [8, 9]}, {"id": "2024-30", "ano": 2024, "num": 30, "materia": "Matemática", "topico": "Área de polígonos", "dif": "Difícil", "enun": "Uma empresa de Inteligência Artificial (IA) montou a logomarca abaixo apresentada para divulgação e\ndistribuição de panfletos: um retângulo representando a letra “i” e um triângulo representando a letra “a”,\nconforme Figura 2. Para impressão das logomarcas, serão utilizadas folhas de 210 mm x 312,5 mm,\nconsiderando um desperdício de exatamente 20%. Partindo desses dados, a quantidade de logomarcas\nque será possível imprimir em cada folha é\n\nFigura 2\n\nFonte: Elaboração Própria.", "alts": ["13.", "14.", "11.", "12."], "pags": [9]}, {"id": "2025-1", "ano": 2025, "num": 1, "materia": "Português", "topico": "Verbos: tempo e modo", "dif": "Fácil", "enun": "Os três primeiros parágrafos apresentam, dominantemente, verbos flexionados no", "alts": ["pretérito perfeito do subjuntivo. Esses verbos indicam ações rotineiras.", "pretérito perfeito do indicativo. Esses verbos indicam ações que foram concluídas no passado.", "pretérito imperfeito do subjuntivo. Esses verbos indicam ações momentâneas.", "pretérito imperfeito do indicativo. Esses verbos indicam ações que não foram concluídas no passado."], "pags": [3]}, {"id": "2025-2", "ano": 2025, "num": 2, "materia": "Português", "topico": "Tipos textuais e estrutura narrativa", "dif": "Fácil", "enun": "No segundo parágrafo, a presença dominante de", "alts": ["verbos de estado constrói uma sequência descritiva, que caracteriza um dia angustiante do personagem.", "verbos de ação constrói uma sequência descritiva, que caracteriza a vida rotineira de um homem insignificante.", "verbos de estado constrói uma sequência narrativa, que objetiva mostrar a vida opressiva do personagem.", "verbos de ação constrói uma sequência narrativa, que objetiva contar eventos do cotidiano de um homem comum."], "pags": [3]}, {"id": "2025-3", "ano": 2025, "num": 3, "materia": "Português", "topico": "Interpretação e inferência (informação explícita e implícita)", "dif": "Fácil", "enun": "Ao longo do texto, há uma repetição significativa da palavra “comum”. Essa recorrência", "alts": ["é desnecessária para a interpretação do texto.", "intensifica a monotonia vivida pelo protagonista.", "é reveladora da falta de habilidade da autora do texto.", "evidencia a falta de sensibilidade de algumas pessoas."], "pags": [3]}, {"id": "2025-4", "ano": 2025, "num": 4, "materia": "Português", "topico": "Interpretação e inferência (informação explícita e implícita)", "dif": "Fácil", "enun": "Na situação final do texto, o trágico destino do homem é percebido, pelo garçom, de forma", "alts": ["emotiva.", "artificial.", "indiferente.", "espetacular."], "pags": [3]}, {"id": "2025-5", "ano": 2025, "num": 5, "materia": "Português", "topico": "Interpretação e inferência (informação explícita e implícita)", "dif": "Fácil", "enun": "A ausência de nomes próprios dos personagens", "alts": ["revela a falta de criatividade do narrador do texto.", "reforça a desumanização vivida pelos personagens.", "estabelece uma intimidade entre leitores e personagens.", "impede os leitores de se identificarem com os personagens."], "pags": [3]}, {"id": "2025-6", "ano": 2025, "num": 6, "materia": "Português", "topico": "Tipos textuais e estrutura narrativa", "dif": "Média", "enun": "A resolução do conflito do personagem principal ocorre quando", "alts": ["a lagosta devora o homem.", "o homem realiza o seu desejo.", "o garçom leva a roupa para casa.", "o garçom devolve a lagosta à vitrine. EDITAL Nº 107/2024 – IFMA"], "pags": [3, 4]}, {"id": "2025-7", "ano": 2025, "num": 7, "materia": "Português", "topico": "Denotação, conotação e figuras de linguagem", "dif": "Média", "enun": "Considerando o texto em sua totalidade, “o homem ser devorado pela lagosta” significa, de maneira\nconotativa, que", "alts": ["a passividade pode destruir o cidadão medíocre.", "o desejo excessivo deixa o ser humano insensível.", "a rotina conduz o ser humano ao tédio e à loucura.", "o enfrentamento ao desconhecido é bastante perigoso."], "pags": [4]}, {"id": "2025-8", "ano": 2025, "num": 8, "materia": "Português", "topico": "Propósito comunicativo, objetivo e tema do texto", "dif": "Média", "enun": "O texto, em sua totalidade, promove uma reflexão sobre", "alts": ["a inaceitabilidade da condição humana imposta socialmente.", "a capacidade de o ser humano comum enfrentar desafios diários.", "a impossibilidade de o homem comum modificar a realidade social estabelecida.", "a possibilidade de as pessoas realizarem seus desejos na sociedade capitalista."], "pags": [4]}, {"id": "2025-9", "ano": 2025, "num": 9, "materia": "Português", "topico": "Classes de palavras (que, advérbio, substantivo, adjetivo)", "dif": "Média", "enun": "Analise o trecho a seguir.\n\nOs dias iam se repetindo no seu comum [1], o comum [2] do trabalho, o mais comum [3] da casa, o\ncomum [4] de tudo.\n\nAs palavras 1, 2, 3 e 4 em destaque são classificadas, respectivamente, como", "alts": ["adjetivo, adjetivo, adjetivo, adjetivo.", "advérbio, adjetivo, advérbio, adjetivo.", "advérbio, substantivo, advérbio, substantivo.", "substantivo, substantivo, substantivo, substantivo."], "pags": [4]}, {"id": "2025-10", "ano": 2025, "num": 10, "materia": "Português", "topico": "Classes de palavras (que, advérbio, substantivo, adjetivo)", "dif": "Média", "enun": "Analise os dois trechos a seguir.\n\nTrecho 1: “O homem ia embora [1] para o seu comum.”\n\nTrecho 2: “Este pedaço era o pior, porque lá as coisas comuns eram mais comuns, embora [2]\nsoubesse ser normal esse comum, mas começava de longe a inquietar-se.”\n\nEm relação aos dois termos em destaque, é correto afirmar que", "alts": ["ambos significam que o homem estava de saída.", "ambos significam que o homem estava indiferente.", "o primeiro pode ser substituído por “mesmo assim”, sem provocar alteração de sentido.", "o segundo pode ser substituído por “mesmo que”, sem provocar alteração de sentido."], "pags": [4]}, {"id": "2025-11", "ano": 2025, "num": 11, "materia": "Português", "topico": "Acentuação gráfica e ortografia", "dif": "Difícil", "enun": "São palavras acentuadas pela regra dos hiatos:", "alts": ["caía, saíra, dicionário.", "saída, destruí-la, possuído.", "cilíndricas, fígado, destruída.", "comê-las, órgãos, crustáceo. EDITAL Nº 107/2024 – IFMA"], "pags": [4, 5]}, {"id": "2025-12", "ano": 2025, "num": 12, "materia": "Português", "topico": "Concordância, regência e crase", "dif": "Difícil", "enun": "Analise o trecho a seguir.\n\nO outro ombro já fora também destruído, o sangue se misturava à toalha, caía no chão fazendo uma\nenorme poça, não enxergava bem a lagosta.\n\nConsiderando a regência verbal, é correto afirmar que o uso do acento grave, em “à toalha”, é obrigatório\nporque", "alts": ["há um artigo feminino exigido pelo verbo “misturar”.", "há uma preposição exigida pelo substantivo feminino.", "ocorre a fusão de um artigo feminino exigido pelo substantivo “sangue” e um artigo feminino exigido pelo substantivo “toalha”.", "ocorre a fusão de uma preposição “a” exigida pelo verbo “misturar” e um artigo feminino “a” admitido pelo substantivo “toalha”."], "pags": [5]}, {"id": "2025-13", "ano": 2025, "num": 13, "materia": "Português", "topico": "Coesão e coerência (referenciação e pronomes)", "dif": "Difícil", "enun": "Analise o trecho a seguir.\n\nO homem ia embora para o seu comum, mas pensando muito que agora tinha um novo interesse. A\nlagosta lhe fora receptiva e isso era bom, muito bom.\n\nO termo em destaque", "alts": ["retoma o substantivo “homem” e funciona como sujeito dos verbos.", "retoma o substantivo “homem” e complementa o sentido dos verbos.", "antecipa o substantivo “homem” e funciona como sujeito dos verbos.", "antecipa o substantivo “homem” e complementa o sentido dos verbos."], "pags": [5]}, {"id": "2025-14", "ano": 2025, "num": 14, "materia": "Português", "topico": "Conjunções e relações de sentido (conectivos)", "dif": "Difícil", "enun": "Analise o trecho a seguir.\n\nLutaria até o fim. Mas não adiantava.\n\nNo trecho, a conjunção “Mas” liga", "alts": ["orações e estabelece relação de adição.", "orações e estabelece relação de oposição.", "períodos e estabelece relação de adição.", "períodos e estabelece relação de oposição."], "pags": [5]}, {"id": "2025-15", "ano": 2025, "num": 15, "materia": "Português", "topico": "Pontuação (vírgula e aspas)", "dif": "Difícil", "enun": "Leia o período a seguir.\n\nMeu Deus, meu Deus, gritou o homem, que ainda tinha um pequeno pedaço de boca.", "alts": ["as duas primeiras vírgulas destacam apostos.", "as duas primeiras vírgulas destacam vocativos.", "a terceira vírgula separa sujeito do predicado.", "a terceira vírgula marca uma pausa respiratória. EDITAL Nº 107/2024 – IFMA"], "pags": [5, 6]}, {"id": "2025-16", "ano": 2025, "num": 16, "materia": "Matemática", "topico": "Operações com racionais (frações e decimais)", "dif": "Fácil", "enun": "Suponha que uma empresa aérea venda uma passagem de São Luís (MA) para Recife (PE) por R$\n672,00 em um determinado dia e horário. Além disso, a companhia possui um programa de milhas aéreas\nque cobra R$ 25,50 pela compra de cada 1.000 milhas. A mesma passagem pode ser adquirida por\n18.672 milhas, mas estas só podem ser compradas em lotes de 1.000. Se a pessoa não possuir milhas\nacumuladas a forma mais vantajosa de adquirir essa passagem é comprá-la com", "alts": ["milhas que custarão R$ 493,84.", "milhas que custarão R$ 484,50.", "dinheiro, pois as milhas custarão R$ 732,45.", "dinheiro, pois as milhas custarão R$ 780,50."], "pags": [6]}, {"id": "2025-17", "ano": 2025, "num": 17, "materia": "Matemática", "topico": "Regra de três (direta e inversa)", "dif": "Fácil", "enun": "Viajar da capital São Luís(MA) para Caxias (MA), a uma velocidade média de 60 km/h, leva\naproximadamente 6 horas e 5 minutos para completar a jornada. Se a velocidade aumentar para 80 km/h,\no tempo necessário para percorrer a mesma distância será de, aproximadamente,", "alts": ["4 horas e 34 minutos.", "4 horas e 44 minutos.", "5 horas e 13 minutos.", "5 horas e 21 minutos."], "pags": [6]}, {"id": "2025-18", "ano": 2025, "num": 18, "materia": "Matemática", "topico": "Equação do 2º grau", "dif": "Fácil", "enun": "Um agricultor do Maranhão está planejando cultivar um novo lote de feijão em um terreno retangular. A\nlargura do terreno é definida como 2𝑥 metros, e o comprimento é igual a 4𝑥 + 8 metros. Sabe-se que a\nárea total do terreno destinada ao cultivo tem 64 m². Sendo assim, as dimensões do terreno (largura e\ncomprimento), em metros, são, respectivamente,", "alts": ["4 e 16.", "5 e 12,8.", "6,4 e 10.", "8 e 8."], "pags": [6]}, {"id": "2025-19", "ano": 2025, "num": 19, "materia": "Matemática", "topico": "Regra de três (direta e inversa)", "dif": "Fácil", "enun": "No Maranhão, a produção de farinha de mandioca é uma atividade importante. Um produtor local fabrica\n150 kg de farinha a cada intervalo de 6 dias e deseja saber quanto tempo será necessário para produzir\n620 kg dessa farinha. Mantendo constante a sua taxa diária de produção, ele produzirá os 620 kg de\nfarinha no", "alts": ["23º dia.", "24º dia.", "25º dia.", "26º dia."], "pags": [6]}, {"id": "2025-20", "ano": 2025, "num": 20, "materia": "Matemática", "topico": "Razões e proporções (razão, taxa, densidade, velocidade)", "dif": "Fácil", "enun": "A Densidade Demográfica é definida como a razão entre a população e a extensão territorial. Em Caxias\n(MA), essa proporção corresponde a, aproximadamente, 30,18 habitantes por quilômetro quadrado. Dado\nque a área da cidade tem, aproximadamente, 5.151 km², a população estimada no município é,\naproximadamente, igual a", "alts": ["155289 habitantes.", "155457 habitantes.", "155673 habitantes.", "155972 habitantes. EDITAL Nº 107/2024 – IFMA"], "pags": [6, 7]}, {"id": "2025-21", "ano": 2025, "num": 21, "materia": "Matemática", "topico": "Teorema de Pitágoras", "dif": "Média", "enun": "Suponha que a distância, em linha reta, entre São Luís (MA) e Caixas (MA) é 309 km e entre Imperatriz\n(MA) e Caixas (MA) é 412 km, conforme figura abaixo. .\n\nDistâncias entre São Luís, Caxias e Imperatriz\n\nFonte: Modificado de Google Maps.\nComo as distâncias, em quilômetros, entre esses três locais formam um triângulo retângulo, deve-se\nconcluir que a distância, em linha reta, entre Imperatriz e São Luís, de acordo com esses dados, equivale\na", "alts": ["505 Km.", "515 Km.", "525 Km.", "535 Km."], "pags": [7]}, {"id": "2025-22", "ano": 2025, "num": 22, "materia": "Matemática", "topico": "Estatística e leitura de dados (média, moda, mediana, gráficos)", "dif": "Média", "enun": "Em uma pesquisa sobre a produção agrícola no Maranhão, foram coletados, em cinco municípios\ndiferentes, dados sobre a produção de três tipos de culturas em toneladas. Os dados estão apresentados\nno quadro a seguir.\n\nProdução Agrícola por Município\nMunicípio                 Milho            Soja (toneladas)                Arroz\n(toneladas)                                      (toneladas)\nSão Luís                1200                      800                    1500\nImperatriz               1500                      700                    1800\nCaxias                  900                      600                    1200\nBacabal                 1100                      900                    1400\nTimon                  1300                      500                    1600\n\nConsiderando os cinco municípios, as médias aritméticas da produção de cada tipo de cultura (milho, soja\ne arroz) , em toneladas, são, respectivamente,", "alts": ["1100, 700 e 1600.", "1200, 600 e 1500.", "1200, 700 e 1500.", "1300, 900 e 1800. EDITAL Nº 107/2024 – IFMA"], "pags": [7, 8]}, {"id": "2025-23", "ano": 2025, "num": 23, "materia": "Matemática", "topico": "Área de polígonos", "dif": "Média", "enun": "Uma fachada retangular de um prédio histórico em São Luís (MA), medindo 10 metros de altura por 14\nmetros de largura, será revestida com azulejos quadrados medindo 20 cm de lado. Sabendo que apenas\n3⁄4 da área total da fachada será coberta por azulejos, a quantidade de azulejos necessária para realizar\no revestimento, desconsiderando eventuais desperdícios, é igual a", "alts": ["525.", "875.", "2625.", "3500."], "pags": [8]}, {"id": "2025-24", "ano": 2025, "num": 24, "materia": "Matemática", "topico": "Porcentagem", "dif": "Média", "enun": "O Maranhão é um dos estados mais populosos do Nordeste, com uma população em torno de 7 milhões\nde habitantes. Se aproximadamente 15% da população vive na capital São Luís(MA), a quantidade de\npessoas que moram na capital é próxima de", "alts": ["595 mil.", "995 mil.", "1,05 milhão.", "5,95 milhões."], "pags": [8]}, {"id": "2025-25", "ano": 2025, "num": 25, "materia": "Matemática", "topico": "Regra de três (direta e inversa)", "dif": "Média", "enun": "Uma fazenda, no Maranhão, produz 6,5 mil quilos de arroz por hectare. Considerando que a produção é\nproporcional à área cultivada, a quantidade de toneladas produzidas em 350 hectares é igual a", "alts": ["2,100.", "2,275.", "2100.", "2275."], "pags": [8]}, {"id": "2025-26", "ano": 2025, "num": 26, "materia": "Matemática", "topico": "Estatística e leitura de dados (média, moda, mediana, gráficos)", "dif": "Difícil", "enun": "Durante o período de chuvas em São Luís (MA), as medições de precipitação mensal, em milímetros,\npara os seis meses foram registradas conforme a tabela abaixo.\n\nMês               Precipitação\n(mm)\nJaneiro                 278\nFevereiro                359\nMarço                  406\nAbril                  462\nMaio                   238\nJunho                   155\n\nA mediana de precipitação para esses seis meses foi igual a", "alts": ["318,5.", "368,5.", "406,0.", "434,0. EDITAL Nº 107/2024 – IFMA"], "pags": [8, 9]}, {"id": "2025-27", "ano": 2025, "num": 27, "materia": "Matemática", "topico": "Múltiplos e divisores (MMC, MDC, divisibilidade, fatores primos)", "dif": "Difícil", "enun": "Um número inteiro positivo é formado por três algarismos, sendo o dígito da centena 3, o da dezena 5 e\no da unidade X. Sabendo que esse número é divisível por 3, a soma dos quadrados dos valores que X\npode assumir é", "alts": ["66.", "76.", "106.", "126."], "pags": [9]}, {"id": "2025-28", "ano": 2025, "num": 28, "materia": "Matemática", "topico": "Múltiplos e divisores (MMC, MDC, divisibilidade, fatores primos)", "dif": "Difícil", "enun": "Para fazer uma ligação para o Maranhão, deve-se discar o código de área do Estado. O código de área\npara a região metropolitana de São Luís (MA) é 98 e para as demais regiões do Estado é 99. O produto\ndos códigos de área 98 e 99 tem a sua decomposição em fatores primos dada por", "alts": ["2. 32 . 7. 112.", "22 . 3. 72 . 11.", "2. 32 . 72 . 11.", "22 . 32 . 7.11."], "pags": [9]}, {"id": "2025-29", "ano": 2025, "num": 29, "materia": "Matemática", "topico": "Probabilidade", "dif": "Difícil", "enun": "Durante um festival cultural no Maranhão, serão distribuídos cartões com imagens de diferentes pontos\nturísticos do estado:\n\n•     500 cartões com a imagem do Parque Nacional dos Lençóis Maranhenses.\n•     1000 cartões com a imagem do Centro Histórico de São Luís.\n•     1500 cartões com a imagem do Palácio dos Leões.\n•     2000 cartões com a imagem da Praia de São Marcos.\n\nSe um cartão é escolhido aleatoriamente, a probabilidade de que o cartão escolhido tenha a imagem da\nPraia de São Marcos ou do Parque Nacional dos Lençóis Maranhenses é igual a", "alts": ["2⁄5.", "1⁄2.", "1⁄10.", "3⁄10."], "pags": [9]}, {"id": "2025-30", "ano": 2025, "num": 30, "materia": "Matemática", "topico": "Juros simples", "dif": "Difícil", "enun": "Uma cooperativa de pescadores no litoral do Maranhão decide investir R$ 25.000,00 na compra de novos\nequipamentos de pesca. Para isso, eles tomaram um empréstimo com uma taxa de juros simples de\n5,25% ao mês. Sabendo que o pagamento será feito ao final de 10 meses, a quantia total de juros que a\ncooperativa pagará é", "alts": ["R$ 13.125,00.", "R$ 16.702,40.", "R$ 38.125,00.", "R$ 41.702,40."], "pags": [9]}, {"id": "2026-1", "ano": 2026, "num": 1, "materia": "Português", "topico": "Propósito comunicativo, objetivo e tema do texto", "dif": "Fácil", "enun": "O texto, em sua totalidade, tem como objetivo principal", "alts": ["criticar o mau comportamento dos filhos.", "mostrar o cotidiano de uma mulher negra.", "fazer uma crítica negativa às mães solteiras.", "contar a história de uma mulher trabalhadora."], "pags": [2]}, {"id": "2026-2", "ano": 2026, "num": 2, "materia": "Português", "topico": "Propósito comunicativo, objetivo e tema do texto", "dif": "Fácil", "enun": "O texto promove, de forma geral, uma reflexão sobre", "alts": ["a força e a resistência das mulheres negras.", "o perigo de deixar os filhos sozinhos em casa.", "o abandono de incapaz por motivo de trabalho.", "a falta de tempo das mães para cuidar dos filhos."], "pags": [2]}, {"id": "2026-3", "ano": 2026, "num": 3, "materia": "Português", "topico": "Tipos textuais e estrutura narrativa", "dif": "Fácil", "enun": "O texto apresenta as características de uma", "alts": ["descrição rotineira.", "descrição momentânea.", "narração de fatos fictícios.", "narração de fatos do cotidiano."], "pags": [3]}, {"id": "2026-4", "ano": 2026, "num": 4, "materia": "Português", "topico": "Classes de palavras (que, advérbio, substantivo, adjetivo)", "dif": "Fácil", "enun": "Na frase, “deve ser legal, ser negão no senegal”, a palavra destaque é um", "alts": ["adjetivo, utilizado de forma positiva.", "adjetivo, utilizado de forma preconceituosa.", "substantivo, utilizado de forma ofensiva.", "substantivo, utilizado de forma elogiosa."], "pags": [3]}, {"id": "2026-5", "ano": 2026, "num": 5, "materia": "Português", "topico": "Verbos: tempo e modo", "dif": "Fácil", "enun": "Leia o trecho abaixo.\n\n“mama tem calo nos pés\nmama precisa de paz”\n\nSe forem conjugados no pretérito imperfeito do indicativo, a nova flexão dos verbos será, respectivament e,", "alts": ["teve e precisou.", "teve e precisava.", "tinha e precisou.", "tinha e precisava."], "pags": [3]}, {"id": "2026-6", "ano": 2026, "num": 6, "materia": "Português", "topico": "Conjunções e relações de sentido (conectivos)", "dif": "Média", "enun": "Analise o trecho a seguir.\n\n“filhinho tem que entender\nmama áfrica vai e vem\nmas não se afasta de você”\n\nO termo em destaque liga", "alts": ["períodos, introduzindo uma ideia de adição.", "orações, introduzindo uma ideia de oposição.", "orações, introduzindo uma ideia de conclusão.", "períodos, introduzindo uma ideia de explicação."], "pags": [3]}, {"id": "2026-7", "ano": 2026, "num": 7, "materia": "Português", "topico": "Interpretação e inferência (informação explícita e implícita)", "dif": "Média", "enun": "A partir da leitura do trecho, deve-se inferir que", "alts": ["nenhuma mãe abandona os filhos.", "algumas mães abandonam os filhos.", "as mães nunca abandonam os filhos.", "as mães sempre abandonam os filhos. Para responder as questões de 08 a 14, considere o texto reproduzido a seguir. TEXTO 2 Pesquisa aponta que 90% das mulheres que se tornaram mães solos no Brasil, nos últimos dez anos, são negras Segundo a pesquisa do Instituto Brasileiro de Economia, da Fundação Getúlio Vargas (FGV), o número de mães solos no Brasil aumentou na última década. Entre 2012 e 2022, esse número cresceu 1,7 milhão, sendo 90% de mães negras. No Brasil, 11 milhões de mulheres criam seus filhos e filhas sozinhas, sem um pai e, muitas vezes, sem ninguém para ajudá-las, aponta a pesquisa da FGV. Entre elas, 72,4% não têm rede de apoio próximo. Ao todo, as mães solos representam 15% dos lares brasileiros, a maioria na região Norte e Nordeste. O levantamento foi realizado pela pesquisadora Janaína Feijó. “Mais de 50% dessas mães não possuem ensino médio. Geralmente elas tiveram o primeiro filho numa idade muito jovem no momento em que tiveram de interromper os estudos. Então isso tende a afetar a carreira profissional dela para sempre porque ela interrompe os estudos numa fase crucial de acumulação de capital humano”, explicou a pesquisadora. As mães que criam seus filhos sozinhas também estão em desvantagem na renda e no mercado de trabalho. O levantamento mostrou que, no quarto trimestre de 2022, o rendimento mensal de uma mãe solo foi de R$ 2.105,00, enquanto o de um homem casado com filhos foi de R$ 3.438,00, 39% a mais. Em comparação com uma mulher casada com filhos, o rendimento foi de R$ 2.626,00 mensal no quarto trimestre, 20% a mais que uma mãe solo. “Ao contrário das mães solo, a trajetória dos homens no mercado não é afetada após o nascimento dos filhos”, diz Feijó. Mas para uma mãe solo negra o cenário é mais complicado. Diferente de uma mãe solo branca ou amarela, o rendimento mensal das mães que se autodeclaram pretas ou pardas foi de R$ 1.685,00, 39% a menos do que outras mães solos. Para Feijó, o que explica essa diferença na renda das mães é o nível de escolaridade e a idade que tiveram os filhos – apenas 3% das mulheres que tiveram filhos aos 15 anos ou menos possuem ensino superior. Entre as negras, 9% das que criam suas crianças sozinhas possuem ensino superior. A pesquisa ainda revela que 31% das mães solos negras com filhos de diferentes idades estão fora do mercado de trabalho, enquanto as que têm filhos de até cinco anos o número sobe para 34,6. Em comparativo, mães solos brancas e amarelas o número é de 26,6% e 27,5%, respectivamente. “As mães negras tendem a ter filhos mais cedo, e isso retroalimenta a situação desfavorável no mercado de trabalho. Consequentement e, vai repercutir no nível salarial”, comenta a pesquisadora. Disponível em: https://mundonegro.inf.br/pesquisa-aponta-que-90-das-mulheres-que-se-tornaram-maes-solo-no-brasil- nos-ultimos-dez-anos-sao-negras/ [Acesso em: agosto de 2025.]"], "pags": [3, 4]}, {"id": "2026-8", "ano": 2026, "num": 8, "materia": "Português", "topico": "Propósito comunicativo, objetivo e tema do texto", "dif": "Média", "enun": "Considerado em sua totalidade, o objetivo principal do texto é", "alts": ["apresentar dados de um estudo sobre mães solos no Brasil.", "comparar o nível socioeconômico das mães solos e das casadas.", "opinar positivamente sobre a problemática das mães solo no Brasil.", "explicar as dificuldades enfrentadas pelas mães solos negras no Brasil."], "pags": [4]}, {"id": "2026-9", "ano": 2026, "num": 9, "materia": "Português", "topico": "Gêneros textuais", "dif": "Média", "enun": "Considerando as suas características, o texto possui elementos característicos do gênero", "alts": ["notícia.", "crônica.", "reportagem.", "artigo de opinião."], "pags": [4]}, {"id": "2026-10", "ano": 2026, "num": 10, "materia": "Português", "topico": "Organização do texto e função de trecho", "dif": "Média", "enun": "Analise o parágrafo a seguir.\n\nAs mães que criam seus filhos sozinhas também estão em desvantagem na renda e no mercado de\ntrabalho. O levantamento mostrou que, no quarto trimestre de 2022, o rendimento mensal de uma mãe\nsolo foi de R$ 2.105,00, enquanto o de um homem casado com filhos foi de R$ 3.438,00, 39% a mais.\nEm comparação com uma mulher casada com filhos, o rendimento foi de R$ 2.626,00 mensal no quart o\ntrimestre, 20% a mais que uma mãe solo. “Ao contrário das mães solo, a trajetória dos homens no\nmercado não é afetada após o nascimento dos filhos”, diz Feijó.\n\nConsiderando a organização dos períodos, a ideia que resume o parágrafo está localizada no", "alts": ["primeiro período.", "segundo período.", "terceiro período.", "quarto período."], "pags": [5]}, {"id": "2026-11", "ano": 2026, "num": 11, "materia": "Português", "topico": "Acentuação gráfica e ortografia", "dif": "Difícil", "enun": "Leia o período a seguir.\n\nA pesquisa ainda revela que 31% das mães solos negras com filhos de diferentes idades estão fora do\nmercado de trabalho, enquanto as que têm filhos de até cinco anos o número sobe para 34,6.\n\nConsiderando as regras de acentuação gráfica, o verbo “ter” recebeu acento", "alts": ["porque o sujeito se encontra no plural.", "por se tratar de um monossílabo tônico.", "porque o sujeito se encontra no singular.", "por se tratar de uma oxítona terminada em “em”."], "pags": [5]}, {"id": "2026-12", "ano": 2026, "num": 12, "materia": "Português", "topico": "Formação de palavras", "dif": "Difícil", "enun": "Leia o período a seguir.\n\nGeralmente elas tiveram o primeiro filho numa idade muito jovem no momento em que tiveram de\ninterromper os estudos.\n\nO substantivo derivado do verbo \"interromper\" é", "alts": ["interrupsão.", "interrupissão.", "interrupção.", "interrupisção."], "pags": [5]}, {"id": "2026-13", "ano": 2026, "num": 13, "materia": "Português", "topico": "Coesão e coerência (referenciação e pronomes)", "dif": "Difícil", "enun": "Considere o trecho a seguir.\n\nNo Brasil, 11 milhões de mulheres criam seus filhos e filhas sozinhas, sem um pai e, muitas vezes, sem\nninguém para ajudá-las, aponta a pesquisa da FGV.\n\nO termo em destaque é um", "alts": ["um artigo que antecipa uma informação, funcionando como objeto direto.", "um artigo que retoma uma informação, funcionando como objeto indireto.", "um pronome que antecipa uma informação, funcionando como objeto indireto.", "um pronome que retoma uma informação, funcionando como objeto direto."], "pags": [6]}, {"id": "2026-14", "ano": 2026, "num": 14, "materia": "Português", "topico": "Pontuação (vírgula e aspas)", "dif      ${me?'':`<div class="tra"><button class="btn" data-act="f"${sent?' disabled':''}>${sent?'✓ Força enviada hoje':hj>0?'💪 Mandar força':'👋 Cutucar'}</button>${dono?`<button class="btn" data-act="rm" data-t="${escA(id)}" data-p="${escA(m.user_id)}" data-n="${escA(m.apelido)}" title="Remover da turma">✕</button>`:''}</div><div class="trp" hidden>${(hj>0?TUR_F:TUR_C).map((x,k)=>`<button class="chip" data-act="fs" data-t="${escA(id)}" data-p="${escA(m.user_id)}" data-k="${hj>0?'forca':'cutucada'}" data-i="${k}">${x[0]} ${esc(x[1])}</button>`).join('')}</div>`}</div><b class="trv">${ord==='s'?(s.seq||0)+'🔥':v}</b></div>`}).join('')}
   <details class="trg"><summary>🧠 Especialistas por assunto <span class="mu">(${ex.length})</span></summary>
    ${help.length?`<p style="margin:10px 0 4px"><b>📌 Peça ajuda</b></p>${help.map(h=>`<div class="trx"><b>${esc(h.t)}</b>: você acerta ${h.mp}% e <b>${esc(h.who)}</b> manda bem (${h.p}%).</div>`).join('')}`:''}
    <p style="margin:10px 0 4px"><b>Quem manda bem</b></p>${ex.length?ex.map(x=>`<div class="trx">🧠 <b>${esc(x.t)}</b> <span class="mu">→ ${esc(x.who)}${x.me?' (você)':''} · ${x.p}% · ${x.n} questões</span></div>`).join(''):'<p class="mu" style="margin:0">Quando alguém responder pelo menos 5 questões de um assunto, aparece aqui quem vai melhor nele.</p>'}</details>
   ${dono?`<details class="trg"><summary>⚙ Gerenciar turma</summary><div class="row" style="margin-top:10px"><input data-in="nome" maxlength="40" value="${escA(T0.nome||'')}"><button class="btn" data-act="rn" data-t="${escA(id)}">Renomear</button></div><div class="row" style="margin-top:8px"><button class="btn" data-act="nc" data-t="${escA(id)}">🔁 Trocar código</button></div><small class="mu" style="display:block;margin-top:8px">Trocar o código desativa os convites antigos (quem já está na turma continua). Para tirar alguém, use o ✕ ao lado do nome. Se você sair, a coroa passa para o membro mais antigo.</small></details>`:''}
   <button class="sbl" data-act="lv" data-t="${escA(id)}">Sair da turma</button></div>`}).join('')};
 const sendF=async t=>{const p=t.dataset.p,k=t.dataset.k,x=(k==='forca'?TUR_F:TUR_C)[+t.dataset.i];
  try{await turRpc('mandar_forca',{p_turma:t.dataset.t,p_para:p,p_tipo:k,p_emoji:x[0],p_msg:x[1]});lsS('tur_f_'+p,hk());confete(x[0]+' Força enviada!');drawList()}
  catch(e){if(/ja_enviou/.test(e.message||'')){lsS('tur_f_'+p,hk());drawList()}alert(turErr(e))}};
 L.onclick=async e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const a=t.dataset.act,id=t.dataset.t;
  try{
   if(a==='o'){ord=t.dataset.o;lsS('tur_ord',ord);drawList();return}
   if(a==='f'){const p=t.closest('.trb').querySelector('.trp');p.hidden=!p.hidden;return}
   if(a==='fs'){await sendF(t);return}
   if(a==='sh'){const g=dados.find(r=>r.turma_id===id).turmas||{},txt='Bora estudar juntos pro IFMA! Entra na minha turma "'+(g.nome||'')+'" no AprovaIFMA pelo link (ou use o código '+g.codigo+'):',url=base()+'#turma='+g.codigo;
    try{if(navigator.share){await navigator.share({text:txt,url});return}}catch(er){if(er&&er.name==='AbortError')return}
    try{await navigator.clipboard.writeText(txt+' '+url);t.textContent='✓ Link copiado';setTimeout(()=>{t.textContent='📤 Convidar'},2200)}catch(er){prompt('Copie o convite:',txt+' '+url)}return}
   if(a==='lv'){if(!confirm('Sair desta turma? Seus amigos deixam de ver seus números.'))return;await turRpc('sair_turma',{p_turma:id});await load(1);return}
   if(a==='rm'){if(!confirm('Remover '+t.dataset.n+' da turma?'))return;await turRpc('remover_membro',{p_turma:id,p_user:t.dataset.p});await load(1);return}
   if(a==='rn'){const v=(t.closest('details').querySelector('[data-in=nome]').value||'').trim();if(!v)return;await turRpc('renomear_turma',{p_turma:id,p_nome:v});await load(1);return}
   if(a==='nc'){if(!confirm('Trocar o código? Convites antigos deixam de funcionar (quem já está na turma continua).'))return;await turRpc('novo_codigo',{p_turma:id});await load(1);return}
  }catch(er){alert(turErr(er))}};
 const drawInv=async()=>{if(!inv)return;
  if(dados.some(r=>r.turmas&&r.turmas.codigo===inv)){lsD('tur_inv');V2.innerHTML='<div class="card2 tur"><p class="mu">✓ Você já faz parte dessa turma.</p></div>';return}
  try{const info=await turRpc('espiar_turma',{p_codigo:inv});
   V2.innerHTML=`<div class="card2 tur" style="border-color:var(--g)"><h3>🎟 Convite para a turma “${esc(info.nome)}”</h3><p class="mu">${info.membros} ${info.membros===1?'pessoa já está':'pessoas já estão'} lá. Escolha seu apelido e entre.</p><div class="row"><input id="iap" maxlength="24" placeholder="Seu apelido" value="${escA(lsG('tur_ap')||nm0())}"><button class="btn p" id="ijn">Entrar na turma</button></div><button class="sbl" id="ino">Agora não</button><div class="sbm" id="imsg"></div></div>`;
   $('#ino',V2).onclick=()=>{lsD('tur_inv');V2.innerHTML=''};
   $('#ijn',V2).onclick=async()=>{const ap=($('#iap',V2).value||'').trim(),m=$('#imsg',V2);if(!ap){m.className='sbm er';m.textContent='Escolha um apelido primeiro.';return}
    try{m.className='sbm';m.textContent='Entrando…';await turRpc('entrar_turma',{p_codigo:inv,p_apelido:ap});lsD('tur_inv');lsS('tur_ap',ap);lsS('tur_n','1');V2.innerHTML='';confete('🎉 Você entrou na turma!');await load()}
    catch(er){m.className='sbm er';m.textContent=turErr(er)}}}
  catch(er){lsD('tur_inv');V2.innerHTML=`<div class="card2 tur"><p class="mu">${/codigo_invalido/.test(er.message||'')?'Esse convite não vale mais (o código foi trocado ou a turma acabou). Peça um novo link.':esc(turErr(er))}</p></div>`}};
 const load=async quiet=>{try{dados=await turList();lsS('tur_n',String(new Set(dados.map(r=>r.turma_id)).size));try{await turInbox()}catch(e){}drawIn();drawList();if(!quiet)turPush(true).catch(()=>{});if(inv&&!invDone){invDone=1;drawInv()}}
  catch(e){if(!quiet||!dados)L.innerHTML=`<div class="card2 tur"><p style="color:var(--er)">${esc(turErr(e))}</p><button class="btn" id="trt">Tentar de novo</button></div>`;const t=$('#trt',L);if(t)t.onclick=()=>load()}};
 Fm.innerHTML=`<div class="card2 tur"><h3>➕ Criar ou entrar numa turma</h3><label class="mu">Seu apelido na turma<input id="tap" maxlength="24" placeholder="Como seus amigos vão te ver" value="${escA(lsG('tur_ap')||nm0())}"></label>
  <div class="row" style="margin-bottom:10px"><input id="tnm" maxlength="40" placeholder="Nome da nova turma"><button class="btn p" id="tcr">Criar turma</button></div>
  <div class="row"><input id="tcd" maxlength="12" placeholder="Código da turma" style="text-transform:uppercase" value="${escA(inv)}"><button class="btn" id="ten">Entrar</button></div><div class="sbm" id="tmsg"></div>
  <small class="mu" style="display:block;margin-top:8px">🔒 Seus amigos veem: apelido, sequência, questões dos últimos 7 dias, % de acerto na 1ª tentativa, erros vencidos, seu desempenho por assunto e se você está estudando agora. Humor, sono, textos e cartas nunca são compartilhados.</small></div>`;
 const act=async(fn,body,ok)=>{const ap=($('#tap',b).value||'').trim();if(!ap){msg('Escolha um apelido primeiro.');return}lsS('tur_ap',ap);body.p_apelido=ap;
  try{msg('Aguarde…',1);await turRpc(fn,body);lsS('tur_n','1');msg(ok,1);$('#tnm',b).value='';$('#tcd',b).value='';if(body.p_codigo&&body.p_codigo.toUpperCase()===inv)lsD('tur_inv');await load()}catch(e){msg(turErr(e))}};
 $('#tcr',b).onclick=()=>{const n=($('#tnm',b).value||'').trim();if(!n){msg('Dê um nome para a turma.');return}act('criar_turma',{p_nome:n},'Turma criada! Toque em “Convidar” para mandar o link aos amigos.')};
 $('#ten',b).onclick=()=>{const c=($('#tcd',b).value||'').trim();if(!c){msg('Digite o código da turma.');return}act('entrar_turma',{p_codigo:c},'Pronto, você entrou na turma!')};
 load();const iv=setInterval(()=>{if(!b.isConnected){clearInterval(iv);return}if(document.visibilityState!=='visible')return;
  if(L.querySelector('.trp:not([hidden])')||L.querySelector('details[open]')||(document.activeElement&&L.contains(document.activeElement)&&document.activeElement.tagName==='INPUT'))return;load(true)},30000)};

/* ---- gatilhos ---- */
document.addEventListener('visibilitychange',()=>{if(!sess)return;if(document.visibilityState==='hidden'){if(timer)sync()}else sync()});
addEventListener('online',()=>{if(sess)sync()});
addEventListener('pagehide',()=>{if(sess&&timer)sync()});
setInterval(()=>{if(sess&&document.visibilityState==='visible'&&!(SIM&&!SIM.done))sync()},90000);
if(sess)sync();else if(!lsG('sb_skip'))setTimeout(()=>openLogin(),700);
if(V==='home'||V==='tur')go(V);
})();

/* ===== mobile: barra inferior, gaveta, ampliar prova, PWA ===== */
(()=>{const BN=[['home','🏠','Início'],['prov','📚','Provas'],['banco','🗂','Banco'],['tur','👥','Turma'],['mais','☰','Mais']];
 $('#bn').innerHTML=BN.map(n=>`<button data-v=${n[0]}><span>${n[1]}</span>${n[2]}</button>`).join('');
 $('#bn').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.v==='mais')$('#sd').classList.remove('c');else go(b.dataset.v)};
 $('#bdp').onclick=()=>$('#sd').classList.add('c');
 $$('#bn button').forEach(n=>n.classList.toggle('on',n.dataset.v===V));
 const lb=$('#lbx'),li=$('#lbi'),close=()=>{lb.classList.remove('on','z');document.body.style.overflow=''};
 document.addEventListener('click',e=>{const im=e.target.closest('img.pgi');if(!im)return;li.src=im.src;lb.classList.add('on');lb.classList.remove('z');document.body.style.overflow='hidden'});
 $('#lbc').onclick=close;$('#lbz').onclick=()=>lb.classList.toggle('z');li.onclick=()=>lb.classList.toggle('z');
 addEventListener('keydown',e=>{if(e.key==='Escape'&&lb.classList.contains('on'))close()});
 if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
