 meio ambiente.", "os problemas ambientais atingem as nações ricas e pobres com a mesma intensidade.", "a prosperidade cresceu, mas a fome continua para milhões de pessoas em todo o mundo."], "pags": [4]}, {"id": "2022-2", "ano": 2022, "num": 2, "materia": "Português", "topico": "Interpretação e inferência (informação explícita e implícita)", "dif": "Fácil", "enun": "Segundo o Texto 1,", "alts": ["o uso da terra e dos oceanos apresenta grande sustentabilidade ambiental.", "a superação do declínio ambiental depende de ação coordenada por todos.", "as mudanças climáticas atuais garantem a superação do declínio ambiental.", "os impactos do declínio ambiental, no planeta, não poderão ser revertidos."], "pags": [4]}, {"id": "2022-3", "ano": 2022, "num": 3, "materia": "Português", "topico": "Propósito comunicativo, objetivo e tema do texto", "dif": "Fácil", "enun": "O objetivo principal do Texto 1 é", "alts": ["apresentar algumas conclusões do relatório do Programa das Nações Unidas para o Meio Ambiente.", "descrever os papéis de todos na sociedade e as transformações necessárias para um futuro sustentável.", "convencer os países ricos a colaborarem com os países em desenvolvimento em prol de um futuro sustentável.", "informar que a poluição do ar causa até 7 milhões de mortes prematuras por ano em todo o planeta."], "pags": [4]}, {"id": "2022-4", "ano": 2022, "num": 4, "materia": "Português", "topico": "Organização do texto e função de trecho", "dif": "Fácil", "enun": "O trecho destacado, logo abaixo do título do Texto 1, cumpre a função de", "alts": ["indicar dois argumentos importantes para a defesa do meio ambiente.", "chamar a atenção para dois temas importantes apresentados no texto.", "complementar as informações prestadas no texto.", "justificar por que a pesquisa do Pnuma foi feita. Considere a inserção do trecho no texto 1 para responder à questão. A NOVA PESQUISA descreve os papéis de todos na sociedade e as transformações necessárias para um futuro sustentável."], "pags": [4]}, {"id": "2022-5", "ano": 2022, "num": 5, "materia": "Português", "topico": "Coesão e coerência (referenciação e pronomes)", "dif": "Fácil", "enun": "A expressão A NOVA PESQUISA tem como referente", "alts": ["Pnuma.", "papéis.", "um novo relatório.", "transformações. EDITAL Nº 084/2021 – IFMA Considere o trecho para responder às questões 6 e 7. Nos últimos 50 anos, a economia global cresceu quase cinco vezes, em grande parte DEVIDO A uma triplicação na extração de recursos naturais e energia QUE impulsionou o crescimento da produção e do consumo."], "pags": [4, 5]}, {"id": "2022-6", "ano": 2022, "num": 6, "materia": "Português", "topico": "Conjunções e relações de sentido (conectivos)", "dif": "Média", "enun": "A expressão DEVIDO A estabelece com a oração seguinte uma relação de", "alts": ["causa.", "tempo.", "oposição.", "concessão."], "pags": [5]}, {"id": "2022-7", "ano": 2022, "num": 7, "materia": "Português", "topico": "Classes de palavras (que, advérbio, substantivo, adjetivo)", "dif": "Média", "enun": "O vocábulo QUE é", "alts": ["advérbio de intensidade que acentua a magnitude do crescimento da economia global.", "pronome relativo que retoma a expressão “triplificação na extração de recursos naturais e energia”.", "partícula que dá realce à expressão “extração de recursos naturais e energia”.", "conjunção integrante que liga o termo “energia” à oração que o sucede. Considere o trecho para responder às questões 8, 9, 10 e 11. Um novo relatório do Programa das Nações Unidas para o Meio Ambiente, (1) PNUMA, (2) diz que as crises da mudança climática, perda de biodiversidade e poluição são interligadas e colocam sob “(3) risco inaceitável” (4) o BEM-ESTAR das gerações atual e futuras."], "pags": [5]}, {"id": "2022-8", "ano": 2022, "num": 8, "materia": "Português", "topico": "Sintaxe: período composto, orações e termos", "dif": "Média", "enun": "O trecho constitui-se de um período composto por", "alts": ["coordenação e subordinação com duas orações.", "subordinação e coordenação com três orações.", "subordinação com três orações.", "coordenação com duas orações."], "pags": [5]}, {"id": "2022-9", "ano": 2022, "num": 9, "materia": "Português", "topico": "Pontuação (vírgula e aspas)", "dif": "Média", "enun": "As vírgulas antes (1) e depois (2) de PNUMA separam um(a)", "alts": ["adjunto adnominal.", "adjunto adverbial.", "aposto explicativo.", "oração adjetiva. EDITAL Nº 084/2021 – IFMA"], "pags": [5, 6]}, {"id": "2022-10", "ano": 2022, "num": 10, "materia": "Português", "topico": "Pontuação (vírgula e aspas)", "dif": "Média", "enun": "As aspas usadas no trecho e indicadas pelos números (3) e (4)", "alts": ["indicam uma expressão irônica.", "destacam uma citação indireta.", "enfatizam a ideia da expressão.", "marcam um neologismo."], "pags": [6]}, {"id": "2022-11", "ano": 2022, "num": 11, "materia": "Português", "topico": "Formação de palavras", "dif": "Difícil", "enun": "O processo de formação da palavra BEM-ESTAR é", "alts": ["aglutinação.", "prefixação.", "sufixação.", "justaposição. Considere o trecho para responder à questão 12. Segundo o Pnuma, “garantir que os investimentos desencadeados pela crise apoiem mudanças transformadoras é a CHAVE para alcançar a sustentabilidade rapidamente.”"], "pags": [6]}, {"id": "2022-12", "ano": 2022, "num": 12, "materia": "Português", "topico": "Denotação, conotação e figuras de linguagem", "dif": "Difícil", "enun": "O vocábulo CHAVE foi usado", "alts": ["denotativamente e significa solução.", "conotativamente e significa solução.", "conotativamente e significa posse.", "denotavivamente e significa posse."], "pags": [6]}, {"id": "2022-13", "ano": 2022, "num": 13, "materia": "Português", "topico": "Propósito comunicativo, objetivo e tema do texto", "dif": "Difícil", "enun": "O propósito comunicativo prioritário do Texto 2 é", "alts": ["criticar a falta de consciência ambiental diante do declínio da natureza.", "explicar o aquecimento global a partir do descontrole climático no planeta.", "informar sobre o declínio ambiental do planeta a partir dos distúrbios climáticos.", "refletir sobre o relacionamento amigável entre pai e filho diante do declínio ambiental."], "pags": [6]}, {"id": "2022-14", "ano": 2022, "num": 14, "materia": "Português", "topico": "Leitura de imagem, gráfico, charge e infográfico", "dif": "Difícil", "enun": "A leitura do Texto 2 permite inferir que", "alts": ["as mudanças climáticas são menos percebidas no mar.", "os pinguins são os animais que mais têm sofrido com as mudanças climáticas.", "os jovens não entendem a relação entre suas ações e as mudanças climáticas.", "as ações humanas têm provocado mudanças climáticas."], "pags": [6]}, {"id": "2022-15", "ano": 2022, "num": 15, "materia": "Português", "topico": "Gêneros textuais", "dif": "Difícil", "enun": "Os textos 1 e 2 desta prova, respectivamente, são", "alts": ["notícia e cartum.", "editorial e quadrinhos.", "entrevista e cartaz.", "reportagem e charge. EDITAL Nº 084/2021 – IFMA"], "pags": [6, 7]}, {"id": "2022-16", "ano": 2022, "num": 16, "materia": "Matemática", "topico": "Juros simples", "dif": "Fácil", "enun": "Segundo o Texto 1, os países em desenvolvimento precisam de financiamentos a juros baixos para\nenfrentarem os desafios ambientais. Pensando nesse apoio, um banco de desenvolvimento oferece\npacotes de ajuda financeira em bilhões de dólares para ações ambientais nesses países a uma taxa de\njuros simples anual de 3%. Se uma nação pegar um empréstimo de 10 bilhões, para pagar após cinco\nanos, o montante a ser pago será", "alts": ["12,5 bilhões.", "15 bilhões.", "11,5 bilhões.", "14 bilhões."], "pags": [7]}, {"id": "2022-17", "ano": 2022, "num": 17, "materia": "Matemática", "topico": "Estatística e leitura de dados (média, moda, mediana, gráficos)", "dif": "Fácil", "enun": "A análise do Gráfico 1 permite afirmar que", "alts": ["os EUA emitem mais dióxido de carbono que todos os demais países listados abaixo dele no gráfico juntos.", "a China emite menos dióxido de carbono que todos os demais países listados no gráfico juntos.", "a UE emite três vezes mais dióxido de carbono que o Japão.", "a Índia emite cinquenta por cento menos dióxido de carbono que a UE. Gráfico 1 Disponível em:https://www.terra.com.br/noticias/ciencia/aquecimento- global-7-graficos-que-mostram-em-que-ponto- estamos,b0d136f8e78c7c4977983ea5ca642088qnt0p4bq.html Acesso em 22 nov. 2021. EDITAL Nº 084/2021 – IFMA"], "pags": [7, 8]}, {"id": "2022-18", "ano": 2022, "num": 18, "materia": "Matemática", "topico": "Círculo (área e comprimento)", "dif": "Fácil", "enun": "Para uma campanha de conscientização sobre as mudanças climáticas, uma ONG confeccionou bottons,\nfeitos com material reciclado, em formato circular, com 4cm de diâmetro. Se 1 cm 2 do botton tem massa\nde 1g e foram confeccionados 1.000.000 bottons, a massa total de material reciclado aproveitada na\nconfecção dos bottons, considerando 𝜋 = 3, foi de", "alts": ["36.000 kg.", "1.200 kg.", "12.000 kg.", "3.600 kg."], "pags": [8]}, {"id": "2022-19", "ano": 2022, "num": 19, "materia": "Matemática", "topico": "Volume do bloco retangular", "dif": "Fácil", "enun": "Para incentivar a discussão sobre o efeito estufa e as mudanças climáticas, um professor produziu uma\nmaquete retratando um ambiente afetado pela poluição. Sabendo que a maquete foi construída em um\nrecipiente em formato de paralelepípedo reto-retângulo, com 1,2m de comprimento, 0,6m de largura e\n0,5m de altura, a capacidade da maquete, em litros, é de", "alts": ["720.", "360.", "72.", "36."], "pags": [8]}, {"id": "2022-20", "ano": 2022, "num": 20, "materia": "Matemática", "topico": "Múltiplos e divisores (MMC, MDC, divisibilidade, fatores primos)", "dif": "Fácil", "enun": "Na tentativa de conscientizar a população sobre as mudanças climáticas e a necessidade de um consumo\nmais sustentável, o governo de um país decidiu veicular uma propaganda nas 3 principais redes de\ntelevisão do país. Na primeira rede, a propaganda ocorre a cada 3 horas; na segunda, a cada 4 horas; e,\nna terceira, a cada 5 horas. Se as propagandas, nas 3 emissoras, foram veiculadas pela primeira vez no\nmesmo instante, a próxima vez que elas serão transmitidas, concomitantemente, pelas 3 emissoras\nocorrerá após", "alts": ["50 horas.", "30 horas.", "60 horas.", "40 horas."], "pags": [8]}, {"id": "2022-21", "ano": 2022, "num": 21, "materia": "Matemática", "topico": "Divisão proporcional", "dif": "Média", "enun": "Um prêmio de 60 bilhões de dólares será distribuído entre três nações em desenvolvimento que\nconseguiram reduzir suas emissões de gases do efeito estufa. Sabe-se que a distribuição ocorrerá de\nforma proporcional ao percentual das emissões que cada nação conseguiu reduzir. A primeira nação\nconseguiu reduzir as emissões em 50%; a segunda, em 40%; e a terceira, em 30%. O valor recebido pela\nnação que reduziu as emissões em 40% foi", "alts": ["15 bilhões.", "25 bilhões.", "30 bilhões.", "20 bilhões. EDITAL Nº 084/2021 – IFMA"], "pags": [8, 9]}, {"id": "2022-22", "ano": 2022, "num": 22, "materia": "Matemática", "topico": "Função do 1º grau (noções de função)", "dif": "Média", "enun": "Um grande empresário, preocupado com o aquecimento global, ofereceu a seu país um prêmio de 100\nmilhões de dólares, caso ele cumprisse a meta de redução de emissão de gases do efeito estufa\nestabelecida para o ano de 2022, em uma reunião global, sobre mudanças climáticas; e mais 10 milhões\nde dólares para cada ano subsequente em que o país alcançasse a meta. A função que representa o\nvalor y que esse país poderá arrecadar, após x anos será", "alts": ["𝑦 = 10.000.000𝑥 + 100.000.000.", "𝑦 = 10.000.000𝑥 + 80.000.000.", "𝑦 = 110.000.000𝑥.", "𝑦 = 80.000.000𝑥."], "pags": [9]}, {"id": "2022-23", "ano": 2022, "num": 23, "materia": "Matemática", "topico": "Equação do 1º grau", "dif": "Média", "enun": "O aumento da temperatura do planeta resulta em mortes causadas por ondas de calor extremas, como a que\natingiu a França, em 2019, e m 1 é", "alts": ["informar às mulheres quais as instâncias estatais de proteção.", "apoiar o Coletivo de Mulheres Negras Baobá.", "apresentar casos de feminicídio no Distrito Federal.", "denunciar o feminicídio contra as mulheres negras. Leia o trecho a seguir para responder às questões de 03 a 08. Soma-se a isso o descaso do governo, [1] que não diminui por falta de políticas públicas eficazes, [2] a demanda entre a prestação de serviços públicos de atenção à mulher e a operacionalidade desses serviços."], "pags": [4]}, {"id": "2023-3", "ano": 2023, "num": 3, "materia": "Português", "topico": "Coesão e coerência (referenciação e pronomes)", "dif": "Fácil", "enun": "Considerando a inserção do trecho no Texto 1, o vocábulo ISSO refere-se", "alts": ["à falta de articulação entre o Sistema de Justiça Criminal, o Sistema de Segurança Pública e o Judiciário.", "à necessidade de qualificação do Sistema de Justiça Criminal, do Sistema de Segurança Pública e do Judiciário.", "ao fato de as pessoas negras serem vistas pelo Judiciário como mais predispostas ao crime.", "ao descaso do governo que não tem políticas públicas para as mulheres negras, especialmente as meninas."], "pags": [4]}, {"id": "2023-4", "ano": 2023, "num": 4, "materia": "Português", "topico": "Classes de palavras (que, advérbio, substantivo, adjetivo)", "dif": "Fácil", "enun": "A expressão que, no trecho, tem valor de adjetivo é", "alts": ["à mulher.", "o descaso.", "do governo.", "de políticas públicas."], "pags": [4]}, {"id": "2023-5", "ano": 2023, "num": 5, "materia": "Português", "topico": "Pontuação (vírgula e aspas)", "dif": "Fácil", "enun": "As vírgulas assinaladas no trecho separam", "alts": ["um aposto explicativo.", "orações coordenadas.", "itens de uma enumeração.", "uma oração subordinada adjetiva. EDITAL Nº 89/2022 – IFMA"], "pags": [4, 5]}, {"id": "2023-6", "ano": 2023, "num": 6, "materia": "Português", "topico": "Conjunções e relações de sentido (conectivos)", "dif": "Média", "enun": "O vocábul linguagem conotativa. EDITAL Nº 89/2022 – IFMA"], "pags": [6, 7]}, {"id": "2023-16", "ano": 2023, "num": 16, "materia": "Matemática", "topico": "Porcentagem", "dif": "Fácil", "enun": "Segundo o Texto 1, cerca de 79% das 90 vítimas entre tentativas e feminicídios consumados no DF,\nentre 2019 e 2020, tiveram como vítimas mulheres negras. O total de mulheres negras que foram vítimas\nfoi", "alts": ["69.", "67.", "71", "73."], "pags": [7]}, {"id": "2023-17", "ano": 2023, "num": 17, "materia": "Matemática", "topico": "Sistema métrico e unidades de medida (inclui tempo)", "dif": "Fácil", "enun": "Se a CPI do feminicídio citada no Texto 01 realizou, em média, duas sessões de 90min durante 18 dos\nmeses em que a CPI esteve ativa, o total de horas que os parlamentares nomeados para a comissão\ndedicaram à CPI foi", "alts": ["55.", "54.", "53.", "52."], "pags": [7]}, {"id": "2023-18", "ano": 2023, "num": 18, "materia": "Matemática", "topico": "Razões e proporções (razão, taxa, densidade, velocidade)", "dif": "Fácil", "enun": "Sabendo que a taxa de mortalidade por feminicídio no ano de 2021 foi de 1,22 mortes para cada 100 mil\nmulheres, uma razão que pode representar essa taxa é", "alts": [". 5 000 000", ". 500 000", ". 1 000 000", ". 1 000 000"], "pags": [7]}, {"id": "2023-19", "ano": 2023, "num": 19, "materia": "Matemática", "topico": "Notação científica", "dif": "Fácil", "enun": "Um levantamento feito por um banco de dados global entre 2000 e 2019 estimou que 27% das mulheres\nde 15 a 49 anos sofreram algum tipo de violência de seus parceiros. Em uma cidade com 8 000 000 de\nmulheres de 15 a 49 anos, se a estimativa do levantamento global se mantiver, o número esperado de\nmulheres que sofrerão algum tipo de violência, em notação científica é", "alts": ["2,16 ⋅ 106 .", "2,16 ⋅ 105 .", "2,7 ⋅ 106 .", "2,7 ⋅ 105 . EDITAL Nº 89/2022 – IFMA"], "pags": [7, 8]}, {"id": "2023-20", "ano": 2023, "num": 20, "materia": "Matemática", "topico": "Função do 1º grau (noções de função)", s corresponde ao fator “Outros”.", "a soma de todos os percentuais é igual a 73,10%."], "pags": [9]}, {"id": "2023-27", "ano": 2023, "num": 27, "materia": "Matemática", "topico": "Equação do 1º grau", "dif": "Difícil", "enun": "Uma sala de aula tem ao todo 33 estudantes. O número de mulheres é a metade do número de homens\ne seis delas relataram já ter sofrido algum tipo de violência física por parte dos seus parceiros. A\nquantidade de mulheres desta sala que não relataram nenhum caso de violência foi um total de", "alts": ["11.", "8.", "5.", "10. EDITAL Nº 89/2022 – IFMA"], "pags": [9, 10]}, {"id": "2023-28", "ano": 2023, "num": 28, "materia": "Matemática", "topico": "Probabilidade", "dif": "Difícil", "enun": "Uma pesquisa de opinião realizada com 180 mulheres, em um terminal rodoviário, investigou a forma de\nviolência contra a mulher da qual elas tinham sido vítimas. De acordo com a Tabela 1, cada mulher\nentrevistada indicava apenas uma forma de violência. Escolhendo uma dessas mulheres, aleatoriamente,\na probabilidade de ela ter sofrido violência física é de", "alts": [".                                                Tabela 1:Número de mulheres que sofreram alguma forma de violência.", ".                                               Formas de Violência       Número Violência Patrimonial      18", ". 47                                                         Violência Sexual             40 2                                                                                       85", ".                                                           Violência Física Violência Moral            17 Violência Psicológica            20 Total                      180"], "pags": [10]}, {"id": "2023-29", "ano": 2023, "num": 29, "materia": "Matemática", "topico": "Círculo (área e comprimento)", "dif": "Difícil", "enun": "Uma mulher vítima de violência doméstica obteve na justiça uma medida protetiva que proibia o agressor\nde se aproximar dela num raio de 500 metros. A área da maior região circular, em m 2, que a vítima está\nprotegida do agressor é de", "alts": ["250000𝜋.", "150000𝜋.", "100000𝜋.", "1250000𝜋."], "pags": [10]}, {"id": "2023-30", "ano": 2023, "num": 30, "materia": "Matemática", "topico": "Estatística e leitura de dados (média, moda, mediana, gráficos)", "dif": "Difícil", "enun": "De acordo com o Texto 1, a CPI do Feminicídio iniciou suas atividades no dia 5 de novembro de 2019 e\nconcluiu os trabalhos com o relatório final no dia 10 de maio de 2021. Supondo que, ao longo desse\nperíodo, foram realizadas um total de 51 reuniões e que, nos meses de janeiro, na Câmara Legislativa,\nnão tem expediente, a média de reuniões por mês de trabalho foi de", "alts": ["5.", "2.", "6.", "3."], "pags": [10]}, {"id": "2024-1", "ano": 2024, "num": 1, "materia": "Português", "topico": "Interpretação e inferência (informação explícita e implícita)", "dif": "Fácil", "enun": "De acordo com o Texto 1, quanto ao uso de tecnologias,", "alts": ["mais da metade das empresas brasileiras só utilizam a Inteligência Artificial.", "menos da metade das empresas brasileiras utilizam a Inteligência Artificial.", "metade das empresas brasileiras não utilizam a Inteligência Artificial.", "metade das empresas brasileiras já utilizam a Inteligência Artificial."], "pags": [3]}, {"id": "2024-2", "ano": 2024, "num": 2, "materia": "Português", "topico": "Propósito comunicativo, objetivo e tema do texto", "dif": "Fácil", "enun": "O propósito comunicativo dominante no Texto 1 é", "alts": ["discutir impactos da Inteligência Artificial no mundo dos negócios brasileiro.", "refletir sobre o uso adequado da Inteligência Artificial nas empresas brasileiras.", "analisar o papel da Inteligência Artificial na automação nas fábricas brasileiras.", "informar sobre o avanço do uso da Inteligência Artificial no mercado brasileiro."], "pags": [3]}, {"id": "2024-3", "ano": 2024, "num": 3, "materia": "Português", "topico": "Tipos textuais e estrutura narrativa", "dif": "Fácil", "enun": "O Texto 1 é predominantemente", "alts": ["narrativo por relatar um fato recente de interesse da sociedade: uso da Inteligência Artificial.", "argumentativo por defender um ponto de vista sobre o uso da Inteligência Artificial.", "narrativo por contar como se deu a entrada da Inteligência Artificial nas empresas brasileiras.", "argumentativo por se contrapor ao uso da Inteligência Artificial nas empresas brasileiras. EDITAL Nº 115/2023 – IFMA"], "pags": [3, 4]}, {"id": "2024-4", "ano": 2024, "num": 4, "materia": "Português", "topico": "Gêneros textuais", "dif": "Fácil", "enun": "Quanto à configuração do gênero, o Texto 1 é um(a)", "alts": ["reportagem.", "comentário.", "notícia.", "editorial. Considere o trecho para responder às questões de 05 a 11. A tecnologia é, (1) cada vez mais (2), (3) uma aliada (4) para as empresas de variados setores e portes. Uma pesquisa global recente da IBM mostrou que (5) 41% das empresas brasileiras utilizam alguma forma de Inteligência Artificial em seu dia a dia. Os dados coletados demonstram que (6) houve um “crescimento considerável” (7) na adoção da tecnologia no cenário pós-pandemia, uma vez que (8) foram muitos os desafios causados pela Covid-19."], "pags": [4]}, {"id": "2024-5", "ano": 2024, "num": 5, "materia": "Português", "topico": "Sintaxe: período composto, orações e termos", "dif": "Fácil", "enun": "Em relação à sua organização, o parágrafo é formado por", "alts": ["três períodos e seis orações.", "dois períodos e quatro orações.", "um único período e seis orações.", "quatro períodos e cinco orações."], "pags": [4]}, {"id": "2024-6", "ano": 2024, "num": 6, "materia": "Português", "topico": "Classes de palavras (que, advérbio, substantivo, adjetivo)", "dif": "Média", "enun": "A expressão CADA VEZ MAIS (2) assume valor de uma locução", "alts": ["prepositiva.", "conjuntiva.", "adverbial.", "adjetiva."], "pags": [4]}, {"id": "2024-7", "ano": 2024, "num": 7, "materia": "Português", "topico": "Pontuação (vírgula e aspas)", "dif": "Média", "enun": "Quanto ao uso das vírgulas marcadas por (1) e (3), é correto afirmar que", "alts": ["isolam adjunto adverbial.", "isolam um adjunto adnominal.", "separam expressão com função de vocativo.", "separam uma expressão com função de aposto."], "pags": [4]}, {"id": "2024-8", "ano": 2024, "num": 8, "materia": "Português", "topico": "Interpretação e inferência (informação explícita e implícita)", "dif": "Média", "enun": "O uso do vocábulo ALIADA (4) deixa implícita a informação de que a tecnologia", "alts": ["contribui para o crescimento econômico das empresas.", "garante o desenvolvimento sustentável e os lucros das empresas.", "contribui com a automação dos serviços e com o aumento do desemprego.", "mudou as relações de trabalho nas empresas, informatizando os serviços. EDITAL Nº 115/2023 – IFMA"], "pags": [4, 5]}, {"id": "2024-9", "ano": 2024, "num": 9, "materia": "Português", "topico": "Classes de palavras (que, advérbio, substantivo, adjetivo)", "dif": "Média", "enun": "Nas ocorrências (5) e (6), o elemento linguístico QUE, respectivamente, tem valor de", "alts": ["pronome e conjunção.", "conjunção e conjunção.", "preposição e interjeição.", "substantivo e advérbio."], "pags": [5]}, {"id": "2024-10", "ano": 2024, "num": 10, "materia": "Português", "topico": "Pontuação (vírgula e aspas)", "dif": "Média", "enun": "Em “CRESCIMENTO CONSIDERÁVEL” (7), as aspas foram usadas para", "alts": ["marcar uma informação irônica.", "demarcar uma citação indireta.", "demarcar uma citação direta.", "enfatizar uma informação importante."], "pags": [5]}, {"id": "2024-11", "ano": 2024, "num": 11, "materia": "Português", "topico": "Conjunções e relações de sentido (conectivos)", "dif": "Difícil", "enun": "O elemento linguístico UMA VEZ QUE (8) introduz uma ideia de", "alts": ["causa em relação a algo que já foi discutido no texto.", "concessão em relação a algo que ainda será dito no texto.", "conclusão em relação às ideias discutidas ao longo do texto.", "consequência das ideias apresentadas ao longo do texto."], "pags": [5]}, {"id": "2024-12", "ano": 2024, "num": 12, "materia": "Português", "topico": "Leitura de imagem, gráfico, charge e infográfico", "dif": "Difícil", "enun": "De acordo com o Texto 2, é correto afirmar que", "alts": ["possivelmente, o ChatGPT resolverá os problemas de escrita na escola", "historicamente, o ChatGPT é a plataforma que se desenvolveu mais rápido.", "atualmente, a Inteligência Artificial simplifica os problemas da humanidade.", "futuramente, a humanidade não precisará mais da Inteligência Artificial."], "pags": [5]}, {"id": "2024-13", "ano": 2024, "num": 13, "materia": "Português", "topico": "Leitura de imagem, gráfico, charge e infográfico", "dif": "Difícil", "enun": "Sobre o Texto 3, é correto afirmar que", "alts": ["a maioria dos brasileiros afirmou já usar a Inteligência Artificial.", "a confiança dos brasileiros na Inteligência Artificial é a maior do mundo.", "o Brasil é um dos países onde a tecnologia tem um alto índice de aceitação.", "o Brasil é um dos quatro países que mais produzem tecnologia no mundo."], "pags": [5]}, {"id": "2024-14", "ano": 2024, "num": 14, "materia": "Português", "topico": "Gêneros textuais", "dif": "Difícil", "enun": "Quanto à configuração genérica, os textos 2 e 3, respectivamente, são", "alts": ["tirinha e tabela.", "anedota e tabela.", "charge e infográfico", "cartum e infográfico."], "pags": [5]}, {"id": "2024-15", "ano": 2024, "num": 15, "materia": "Português", "topico": "Comparação entre textos e intertextualidade", "dif": "Difícil", "enun": "Os textos 1, 2 e 3 apresentam em comum o", "alts": ["tipo textual.", "gênero textual.", "registro informal.", "recorte temático. EDITAL Nº 115/2023 – IFMA"], "pags": [5, 6]}, {"id": "2024-16", "ano": 2024, "num": 16, "materia": "Matemática", "topico": "Porcentagem", "dif": "Fácil", "enun": "O Texto 1 mostra que 41% das empresas brasileiras utilizam alguma forma de Inteligência Artificial em\nseu dia a dia. Considerando-se que existam 21 milhões de empresas no Brasil, a quantidade de\ncorporações com uso dessa tecnologia é", "alts": ["8.400.000.", "8.610.000.", "12.390.000.", "12.600.000."], "pags": [6]}, {"id": "2024-17", "ano": 2024, "num": 17, "materia": "Matemática", "topico": "Razões e proporções (razão, taxa, densidade, velocidade)", "dif": "Fácil", "enun": "De acordo com o Texto 1, U$ 504 milhões equivale a cerca de R$ 2,61 bilhões. Sendo assim, é possível\nafirmar que a cotação do dólar, em reais, aproximadamente, foi de", "alts": ["R$ 5,12.", "R$ 5,24.", "R$ 5,18.", "R$ 5,30."], "pags": [6]}, {"id": "2024-18", "ano": 2024, "num": 18, "materia": "Matemática", "topico": "Estatística e leitura de dados (média, moda, mediana, gráficos)", "dif": "Fácil", "enun": "Tomando por base os valores percentuais presentes nas barras do Texto 3, a média aritmética da\naceitação nos 10 países que mais confiam em inteligência artificial é de", "alts": ["47,7%.", "53,2%.", "63,1%.", "43,9%."], "pags": [6]}, {"id": "2024-19", "ano": 2024, "num": 19, "materia": "Matemática", "topico": "Estatística e leitura de dados (média, moda, mediana, gráficos)", "dif": "Fácil", "enun": "A leitura do Texto 3 permite afirmar que a diferença entre os percentuais do país que mais aceita e do\nque menos aceita (dentre os 10 com maior aceitação) a Inteligência Artificial é", "alts": ["41%.", "40%.", "39%.", "42%."], "pags": [6]}, {"id": "2024-20", "ano": 2024, "num": 20, "materia": "Matemática", "topico": "Regra de três (direta e inversa)", "dif": "Fácil", "enun": "Considerando que, no Texto 3, as barras representantes dos percentuais de aceitação da Inteligência\nArtificial possuem áreas proporcionais ao seu respectivo percentual e que a barra referente à Índia\n(primeira posição) é um retângulo de dimensões 0,8 cm x 4 cm, é possível afirmar que a barra de\nCingapura (quinta posição) é um retângulo de área igual a", "alts": ["2,22 cm2.", "3,02 cm2.", "1,92 cm2.", "3,20 cm2. EDITAL Nº 115/2023 – IFMA"], "pags": [6, 7]}, {"id": "2024-21", "ano": 2024, "num": 21, "materia": "Matemática", "topico": "Estatística e leitura de dados (média, moda, mediana, gráficos)", "dif": "Média", "enun": "De acordo com os dados apresentados no Texto 3, a moda dos percentuais de aceitação nos 10 países\nque mais confiam na inteligência artificial é de", "alts": ["42,5%.", "54,5%.", "26%.", "34%."], "pags": [7]}, {"id": "2024-22", "ano": 2024, "num": 22, "materia": "Matemática", "topico": "Múltiplos e divisores (MMC, MDC, divisibilidade, fatores primos)", "dif": "Média", "enun": "Em um número natural, formado por três algarismos, o dígito da centena é 4, o da dezena é 6 e o da\nunidade é Y, formando o número 46Y. Sabendo que esse número é múltiplo de 3, o produto dos valores\nque Y pode assumir é", "alts": ["10.", "40.", "20.", "80."], "pags": [7]}, {"id": "2024-23", "ano": 2024, "num": 23, "materia": "Matemática", "topico": "Probabilidade", "dif": "Média", "enun": "Considere que uma determinada pessoa estava estudando probabilidade com auxílio do aplicativo\nCHATGPT, e fez o questionamento apresentado na Figura 1 abaixo:\n\nFigura 1\n\nFonte: Aplicativo CHATGPT.\n\nApós essa mensagem, o aplicativo CHATGPT respondeu, corretamente, que a probabilidade, nessa\nsituação, corresponderia a", "alts": ["2/3.", "4/5.", "1/3.", "1/2."], "pags": [7]}, {"id": "2024-24", "ano": 2024, "num": 24, "materia": "Matemática", "topico": "Porcentagem", "dif": "Média", "enun": "De acordo com o Texto 1, a estimativa do investimento realizado por companhias brasileiras em\nInteligência Artificial, no ano de 2022, foi de U$ 504 milhões, o que representa um aumento de 28% em\nrelação ao ano anterior. Dessa forma, no ano de 2021, em valores estimados, o investimento teria sido\nequivalente a", "alts": ["U$ 363.880.000,00.", "U$ 402.290.000,00.", "U$ 393.750.000,00.", "U$ 355.438.000,00. EDITAL Nº 115/2023 – IFMA"], "pags": [7, 8]}, {"id": "2024-25", "ano": 2024, "num": 25, "materia": "Matemática", "topico": "Equação do 2º grau", "dif": "Média", "enun": "Para a construção de uma microempresa de treinamento em programas e recursos de Inteligência\nArtificial, foi utilizado um terreno retangular, cujo comprimento é de 5 m maior do que a largura e a área\nigual a 300 m2. A soma dos lados desse terreno retangular é", "alts": ["70 m.", "60 m.", "54 m.", "72 m."], "pags": [8]}, {"id": "2024-26", "ano": 2024, "num": 26, "materia": "Matemática", "topico": "Teorema de Pitágoras", "dif": "Difícil", "enun": "Sabendo que as medidas dos lados de um triângulo retângulo podem ser representadas por x, x+5 e 25\n(sendo esse último referente ao maior lado), o produto dos valores dos lados desse triângulo é de", "alts": ["6.000.", "7.500.", "9.000.", "4.500."], "pags": [8]}, {"id": "2024-27", "ano": 2024, "num": 27, "materia": "Matemática", "topico": "Regra de três (direta e inversa)", "dif": "Difícil", "enun": "Um jovem estudante pretende ir ao Vale do Silício, localizado nos Estados Unidos, para fazer um curso\nsobre Inteligência Artificial. Contudo, as distâncias nas estradas do país são marcadas em milhas. Como\nele está acostumado a utilizar os valores em quilômetros e quer entender melhor as distâncias locais,\nanalisa uma placa, indicando que a cidade aonde ele deseja chegar, está a 92 milhas de distância.\nSabendo que 1 quilômetro é equivalente a cerca de 0,62 milhas, é correto afirmar que a distância a ser\npercorrida por ele, em quilômetros, aproximadamente, é de", "alts": ["155.", "132.", "126.", "148."], "pags": [8]}, {"id": "2024-28", "ano": 2024, "num": 28, "materia": "Matemática", "topico": "Juros simples", "dif": "Difícil", "enun": "Para empreender, no ramo de Inteligência Artificial, um recém-formado na área de TI (Tecnologia da\nInformação) pretende adquirir um empréstimo com um amigo. A condição acordada entre eles garantiu\num valor de 25 mil reais, valor a ser pago ao final de dois anos, com taxa de juros simples de 1% ano\nmês. Desse modo, ao final desse tempo, ele terá pago um valor total de", "alts": ["R$ 30.000,00.", "R$ 31.000,00.", "R$ 29.000,00.", "R$ 28.000,00."], "pags": [8]}, {"id": "2024-29", "ano": 2024, "num": 29, "materia": "Matemática", "topico": "Porcentagem", "dif": "Difícil", "enun": "Segundo o Texto 1, os investimentos em Inteligência Artificial aumentaram 28% entre 2021 e 2022. Esse\npercentual de 28%, na forma de fração, pode ser representado como", "alts": ["7/25.", "7/20.", "13/21.", "1/4. EDITAL Nº 115/2023 – IFMA"], "pags": [8, 9]}, {"id": "2024-30", "ano": 2024, "num": 30, "materia": "Matemática", "topico": "Área de polígonos", "dif": "Difícil", "enun": "Uma empresa de Inteligência Artificial (IA) montou a logomarca abaixo apresentada para divulgação e\ndistribuição de panfletos: um retângulo representando a letra “i” e um triângulo representando a letra “a”,\nconforme Figura 2. Para impressão das logomarcas, serão utilizadas folhas de 210 mm x 312,5 mm,\nconsiderando um desperdício de exatamente 20%. Partindo desses dados, a quantidade de logomarcas\nque será possível imprimir em cada folha é\n\nFigura 2\n\nFonte: Elaboração Própria.", "alts": ["13.", "14.", "11.", "12."], "pags": [9]}, {"id": "2025-1", "ano": 2025, "num": 1, "materia": "Português", "topico": "Verbos: tempo e modo", "dif": "Fácil", "enun": "Os três primeiros parágrafos apresentam, dominantemente, verbos flexionados no", "alts": ["pretérito perfeito do subjuntivo. Esses verbos indicam ações rotineiras.", "pretérito perfeito do indicativo. Esses verbos indicam ações que foram concluídas no passado.", "pretérito imperfeito do subjuntivo. Esses verbos indicam ações momentâneas.", "pretérito imperfeito do indicativo. Esses verbos indicam ações que não foram concluídas no passado."], "pags": [3]}, {"id": "2025-2", "ano": 2025, "num": 2, "materia": "Português", "topico": "Tipos textuais e estrutura narrativa", "dif": "Fácil", "enun": "No segundo parágrafo, a presença dominante de", "alts": ["verbos de estado constrói uma sequência descritiva, que caracteriza um dia angustiante do personagem.", "verbos de ação constrói uma sequência descritiva, que caracteriza a vida rotineira de um homem insignificante.", "verbos de estado constrói uma sequência narrativa, que objetiva mostrar a vida opressiva do personagem.", "verbos de ação constrói uma sequência narrativa, que objetiva contar eventos do cotidiano de um homem comum."], "pags": [3]}, {"id": "2025-3", "ano": 2025, "num": 3, "materia": "Português", "topico": "Interpretação e inferência (informação explícita e implícita)", "dif": "Fácil", "enun": "Ao longo do texto, há uma repetição significativa da palavra “comum”. Essa recorrência", "alts": ["é desnecessária para a interpretação do texto.", "intensifica a monotonia vivida pelo protagonista.", "é reveladora da falta de habilidade da autora do texto.", "evidencia a falta de sensibilidade de algumas pessoas."], "pags": [3]}, {"id": "2025-4", "ano": 2025, "num": 4, "materia": "Português", "topico": "Interpretação e inferência (informação explícita e implícita)", "dif": "Fácil", "enun": "Na situação final do texto, o trágico destino do homem é percebido, pelo garçom, de forma", "alts": ["emotiva.", "artificial.", "indiferente.", "espetacular."], "pags": [3]}, {"id": "2025-5", "ano": 2025, "num": 5, "materia": "Português", "topico": "Interpretação e inferência (informação explícita e implícita)", "dif": "Fácil", "enun": "A ausência de nomes próprios dos personagens", "alts": ["revela a falta de criatividade do narrador do texto.", "reforça a desumanização vivida pelos personagens.", "estabelece uma intimidade entre leitores e personagens.", "impede os leitores de se identificarem com os personagens."], "pags": [3]}, {"id": "2025-6", "ano": 2025, "num": 6, "materia": "Português", "topico": "Tipos textuais e estrutura narrativa", "dif": "Média", "enun": "A resolução do conflito do personagem principal ocorre quando", "alts": ["a lagosta devora o homem.", "o homem realiza o seu desejo.", "o garçom leva a roupa para casa.", "o garçom devolve a lagosta à vitrine. EDITAL Nº 107/2024 – IFMA"], "pags": [3, 4]}, {"id": "2025-7", "ano": 2025, "num": 7, "materia": "Português", "topico": "Denotação, conotação e figuras de linguagem", "dif": "Média", "enun": "Considerando o texto em sua totalidade, “o homem ser devorado pela lagosta” significa, de maneira\nconotativa, que", "alts": ["a passividade pode destruir o cidadão medíocre.", "o desejo excessivo deixa o ser humano insensível.", "a rotina conduz o ser humano ao tédio e à loucura.", "o enfrentamento ao desconhecido é bastante perigoso."], "pags": [4]}, {"id": "2025-8", "ano": 2025, "num": 8, "materia": "Português", "topico": "Propósito comunicativo, objetivo e tema do texto", "dif": "Média", "enun": "O texto, em sua totalidade, promove uma reflexão sobre", "alts": ["a inaceitabilidade da condição humana imposta socialmente.", "a capacidade de o ser humano comum enfrentar desafios diários.", "a impossibilidade de o homem comum modificar a realidade social estabelecida.", "a possibilidade de as pessoas realizarem seus desejos na sociedade capitalista."], "pags": [4]}, {"id": "2025-9", "ano": 2025, "num": 9, "materia": "Português", "topico": "Classes de palavras (que, advérbio, substantivo, adjetivo)", "dif": "Média", "enun": "Analise o trecho a seguir.\n\nOs dias iam se repetindo no seu comum [1], o comum [2] do trabalho, o mais comum [3] da casa, o\ncomum [4] de tudo.\n\nAs palavras 1, 2, 3 e 4 em destaque são classificadas, respectivamente, como", "alts": ["adjetivo, adjetivo, adjetivo, adjetivo.", "advérbio, adjetivo, advérbio, adjetivo.", "advérbio, substantivo, advérbio, substantivo.", "substantivo, substantivo, substantivo, substantivo."], "pags": [4]}, {"id": "2025-10", "ano": 2025, "num": 10, "materia": "Português", "topico": "Classes de palavras (que, advérbio, substantivo, adjetivo)", "dif": "Média", "enun": "Analise os dois trechos a seguir.\n\nTrecho 1: “O homem ia embora [1] para o seu comum.”\n\nTrecho 2: “Este pedaço era o pior, porque lá as coisas comuns eram mais comuns, embora [2]\nsoubesse ser normal esse comum, mas começava de longe a inquietar-se.”\n\nEm relação aos dois termos em destaque, é correto afirmar que", "alts": ["ambos significam que o homem estava de saída.", "ambos significam que o homem estava indiferente.", "o primeiro pode ser substituído por “mesmo assim”, sem provocar alteração de sentido.", "o segundo pode ser substituído por “mesmo que”, sem provocar alteração de sentido."], "pags": [4]}, {"id": "2025-11", "ano": 2025, "num": 11, "materia": "Português", "topico": "Acentuação gráfica e ortografia", "dif": "Difícil", "enun": "São palavras acentuadas pela regra dos hiatos:", "alts": ["caía, saíra, dicionário.", "saída, destruí-la, possuído.", "cilíndricas, fígado, destruída.", "comê-las, órgãos, crustáceo. EDITAL Nº 107/2024 – IFMA"], "pags": [4, 5]}, {"id": "2025-12", "ano": 2025, "num": 12, "materia": "Português", "topico": "Concordância, regência e crase", "dif": "Difícil", "enun": "Analise o trecho a seguir.\n\nO outro ombro já fora também destruído, o sangue se misturava à toalha, caía no chão fazendo uma\nenorme poça, não enxergava bem a lagosta.\n\nConsiderando a regência verbal, é correto afirmar que o uso do acento grave, em “à toalha”, é obrigatório\nporque", "alts": ["há um artigo feminino exigido pelo verbo “misturar”.", "há uma preposição exigida pelo substantivo feminino.", "ocorre a fusão de um artigo feminino exigido pelo substantivo “sangue” e um artigo feminino exigido pelo substantivo “toalha”.", "ocorre a fusão de uma preposição “a” exigida pelo verbo “misturar” e um artigo feminino “a” admitido pelo substantivo “toalha”."], "pags": [5]}, {"id": "2025-13", "ano": 2025, "num": 13, "materia": "Português", "topico": "Coesão e coerência (referenciação e pronomes)", "dif": "Difícil", "enun": "Analise o trecho a seguir.\n\nO homem ia embora para o seu comum, mas pensando muito que agora tinha um novo interesse. A\nlagosta lhe fora receptiva e isso era bom, muito bom.\n\nO termo em destaque", "alts": ["retoma o substantivo “homem” e funciona como sujeito dos verbos.", "retoma o substantivo “homem” e complementa o sentido dos verbos.", "antecipa o substantivo “homem” e funciona como sujeito dos verbos.", "antecipa o substantivo “homem” e complementa o sentido dos verbos."], "pags": [5]}, {"id": "2025-14", "ano": 2025, "num": 14, "materia": "Português", "topico": "Conjunções e relações de sentido (conectivos)", "dif": "Difícil", "enun": "Analise o trecho a seguir.\n\nLutaria até o fim. Mas não adiantava.\n\nNo trecho, a conjunção “Mas” liga", "alts": ["orações e estabelece relação de adição.", "orações e estabelece relação de oposição.", "períodos e estabelece relação de adição.", "períodos e estabelece relação de oposição."], "pags": [5]}, {"id": "2025-15", "ano": 2025, "num": 15, "materia": "Português", "topico": "Pontuação (vírgula e aspas)", "dif": "Difícil", "enun": "Leia o período a seguir.\n\nMeu Deus, meu Deus, gritou o homem, que ainda tinha um pequeno pedaço de boca.", "alts": ["as duas primeiras vírgulas destacam apostos.", "as duas primeiras vírgulas destacam vocativos.", "a terceira vírgula separa sujeito do predicado.", "a terceira vírgula marca uma pausa respiratória. EDITAL Nº 107/2024 – IFMA"], "pags": [5, 6]}, {"id": "2025-16", "ano": 2025, "num": 16, "materia": "Matemática", "topico": "Operações com racionais (frações e decimais)", "dif": "Fácil", "enun": "Suponha que uma empresa aérea venda uma passagem de São Luís (MA) para Recife (PE) por R$\n672,00 em um determinado dia e horário. Além disso, a companhia possui um programa de milhas aéreas\nque cobra R$ 25,50 pela compra de cada 1.000 milhas. A mesma passagem pode ser adquirida por\n18.672 milhas, mas estas só podem ser compradas em lotes de 1.000. Se a pessoa não possuir milhas\nacumuladas a forma mais vantajosa de adquirir essa passagem é comprá-la com", "alts": ["milhas que custarão R$ 493,84.", "milhas que custarão R$ 484,50.", "dinheiro, pois as milhas custarão R$ 732,45.", "dinheiro, pois as milhas custarão R$ 780,50."], "pags": [6]}, {"id": "2025-17", "ano": 2025, "num": 17, "materia": "Matemática", "topico": "Regra de três (direta e inversa)", "dif": "Fácil", "enun": "Viajar da capital São Luís(MA) para Caxias (MA), a uma velocidade média de 60 km/h, leva\naproximadamente 6 horas e 5 minutos para completar a jornada. Se a velocidade aumentar para 80 km/h,\no tempo necessário para percorrer a mesma distância será de, aproximadamente,", "alts": ["4 horas e 34 minutos.", "4 horas e 44 minutos.", "5 horas e 13 minutos.", "5 horas e 21 minutos."], "pags": [6]}, {"id": "2025-18", "ano": 2025, "num": 18, "materia": "Matemática", "topico": "Equação do 2º grau", "dif": "Fácil", "enun": "Um agricultor do Maranhão está planejando cultivar um novo lote de feijão em um terreno retangular. A\nlargura do terreno é definida como 2𝑥 metros, e o comprimento é igual a 4𝑥 + 8 metros. Sabe-se que a\nárea total do terreno destinada ao cultivo tem 64 m². Sendo assim, as dimensões do terreno (largura e\ncomprimento), em metros, são, respectivamente,", "alts": ["4 e 16.", "5 e 12,8.", "6,4 e 10.", "8 e 8."], "pags": [6]}, {"id": "2025-19", "ano": 2025, "num": 19, "materia": "Matemática", "topico": "Regra de três (direta e inversa)", "dif": "Fácil", "enun": "No Maranhão, a produção de farinha de mandioca é uma atividade importante. Um produtor local fabrica\n150 kg de farinha a cada intervalo de 6 dias e deseja saber quanto tempo será necessário para produzir\n620 kg dessa farinha. Mantendo constante a sua taxa diária de produção, ele produzirá os 620 kg de\nfarinha no", "alts": ["23º dia.", "24º dia.", "25º dia.", "26º dia."], "pags": [6]}, {"id": "2025-20", "ano": 2025, "num": 20, "materia": "Matemática", "topico": "Razões e proporções (razão, taxa, densidade, velocidade)", "dif": "Fácil", "enun": "A Densidade Demográfica é definida como a razão entre a população e a extensão territorial. Em Caxias\n(MA), essa pro ias aritméticas da produção de cada tipo de cultura (milho, soja\ne arroz) , em toneladas, são, respectivamente,", "alts": ["1100, 700 e 1600.", "1200, 600 e 1500.", "1200, 700 e 1500.", "1300, 900 e 1800. EDITAL Nº 107/2024 – IFMA"], "pags": [7, 8]}, {"id": "2025-23", "ano": 2025, "num": 23, "materia": "Matemática", "topico": "Área de polígonos", "dif": "Média", "enun": "Uma fachada retangular de um prédio histórico em São Luís (MA), medindo 10 metros de altura por 14\nmetros de largura, será revestida com azulejos quadrados medindo 20 cm de lado. Sabendo que apenas\n3⁄4 da área total da fachada será coberta por azulejos, a quantidade de azulejos necessária para realizar\no revestimento, desconsiderando eventuais desperdícios, é igual a", "alts": ["525.", "875.", "2625.", "3500."], "pags": [8]}, {"id": "2025-24", "ano": 2025, "num": 24, "materia": "Matemática", "topico": "Porcentagem", "dif": "Média", "enun": "O Maranhão é um dos estados mais populosos do Nordeste, com uma população em torno de 7 milhões\nde habitantes. Se aproximadamente 15% da população vive na capital São Luís(MA), a quantidade de\npessoas que moram na capital é próxima de", "alts": ["595 mil.", "995 mil.", "1,05 milhão.", "5,95 milhões."], "pags": [8]}, {"id": "2025-25", "ano": 2025, "num": 25, "materia": "Matemática", "topico": "Regra de três (direta e inversa)", "dif": "Média", "enun": "Uma fazenda, no Maranhão, produz 6,5 mil quilos de arroz por hectare. Considerando que a produção é\nproporcional à área cultivada, a quantidade de toneladas produzidas em 350 hectares é igual a", "alts": ["2,100.", "2,275.", "2100.", "2275."], "pags": [8]}, {"id": "2025-26", "ano": 2025, "num": 26, "materia": "Matemática", "topico": "Estatística e leitura de dados (média, moda, mediana, gráficos)", "dif": "Difícil", "enun": "Durante o período de chuvas em São Luís (MA), as medições de precipitação mensal, em milímetros,\npara os seis meses foram registradas conforme a tabela abaixo.\n\nMês               Precipitação\n(mm)\nJaneiro                 278\nFevereiro                359\nMarço                  406\nAbril                  462\nMaio                   238\nJunho                   155\n\nA mediana de precipitação para esses seis meses foi igual a", "alts": ["318,5.", "368,5.", "406,0.", "434,0. EDITAL Nº 107/2024 – IFMA"], "pags": [8, 9]}, {"id": "2025-27", "ano": 2025, "num": 27, "materia": "Matemática", "topico": "Múltiplos e divisores (MMC, MDC, divisibilidade, fatores primos)", "dif": "Difícil", "enun": "Um número inteiro positivo é formado por três algarismos, sendo o dígito da centena 3, o da dezena 5 e\no da unidade X. Sabendo que esse número é divisível por 3, a soma dos quadrados dos valores que X\npode assumir é", "alts": ["66.", "76.", "106.", "126."], "pags": [9]}, {"id": "2025-28", "ano": 2025, "num": 28, "materia": "Matemática", "topico": "Múltiplos e divisores (MMC, MDC, divisibilidade, fatores primos)", "dif": "Difícil", "enun": "Para fazer uma ligação para o Maranhão, deve-se discar o código de área do Estado. O código de área\npara a região metropolitana de São Luís (MA) é 98 e para as demais regiões do Estado é 99. O produto\ndos códigos de área 98 e 99 tem a sua decomposição em fatores primos dada por", "alts": ["2. 32 . 7. 112.", "22 . 3. 72 . 11.", "2. 32 . 72 . 11.", "22 . 32 . 7.11."], "pags": [9]}, {"id": "2025-29", "ano": 2025, "num": 29, "materia": "Matemática", "topico": "Probabilidade", "dif": "Difícil", "enun": "Durante um festival cultural no Maranhão, serão distribuídos cartões com imagens de diferentes pontos\nturísticos do estado:\n\n•     500 cartões com a imagem do Parque Nacional dos Lençóis Maranhenses.\n•     1000 cartões com a imagem do Centro Histórico de São Luís.\n•     1500 cartões com a imagem do Palácio dos Leões.\n•     2000 cartões com a imagem da Praia de São Marcos.\n\nSe um cartão é escolhido aleatoriamente, a probabilidade de que o cartão escolhido tenha a imagem da\nPraia de São Marcos ou do Parque Nacional dos Lençóis Maranhenses é igual a", "alts": ["2⁄5.", "1⁄2.", "1⁄10.", "3⁄10."], "pags": [9]}, {"id": "2025-30", "ano": 2025, "num": 30, "materia": "Matemática", "topico": "Juros simples", "dif": "Difícil", "enun": "Uma cooperativa de pescadores no litoral do Maranhão decide investir R$ 25.000,00 na compra de novos\nequipamentos de pesca. Para isso, eles tomaram um empréstimo com uma taxa de juros simples de\n5,25% ao mês. Sabendo que o pagamento será feito ao final de 10 meses, a quantia total de juros que a\ncooperativa pagará é", "alts": ["R$ 13.125,00.", "R$ 16.702,40.", "R$ 38.125,00.", "R$ 41.702,40."], "pags": [9]}, {"id": "2026-1", "ano": 2026, "num": 1, "materia": "Português", "topico": "Propósito comunicativo, objetivo e tema do texto", "dif": "Fácil", "enun": "O texto, em sua totalidade, tem como objetivo principal", "alts": ["criticar o mau comportamento dos filhos.", "mostrar o cotidiano de uma mulher negra.", "fazer uma crítica negativa às mães solteiras.", "contar a história de uma mulher trabalhadora."], "pags": [2]}, {"id": "2026-2", "ano": 2026, "num": 2, "materia": "Português", "topico": "Propósito comunicativo, objetivo e tema do texto", "dif": "Fácil", "enun": "O texto promove, de forma geral, uma reflexão sobre", "alts": ["a força e a resistência das mulheres negras.", "o perigo de deixar os filhos sozinhos em casa.", "o abandono de incapaz por motivo de trabalho.", "a falta de tempo das mães para cuidar dos filhos."], "pags": [2]}, {"id": "2026-3", "ano": 2026, "num": 3, "materia": "Português", "topico": "Tipos textuais e estrutura narrativa", "dif": "Fácil", "enun": "O texto apresenta as características de uma", "alts": ["descrição rotineira.", "descrição momentânea.", "narração de fatos fictícios.", "narração de fatos do cotidiano."], "pags": [3]}, {"id": "2026-4", "ano": 2026, "num": 4, "materia": "Português", "topico": "Classes de palavras (que, advérbio, substantivo, adjetivo)", "dif": "Fácil", "enun": "Na frase, “deve ser legal, ser negão no senegal”, a palavra destaque é um", "alts": ["adjetivo, utilizado de forma positiva.", "adjetivo, utilizado de forma preconceituosa.", "substantivo, utilizado de forma ofensiva.", "substantivo, utilizado de forma elogiosa."], "pags": [3]}, {"id": "2026-5", "ano": 2026, "num": 5, "materia": "Português", "topico": "Verbos: tempo e modo", "dif": "Fácil", "enun": "Leia o trecho abaixo.\n\n“mama tem calo nos pés\nmama precisa de paz”\n\nSe forem conjugados no pretérito imperfeito do indicativo, a nova flexão dos verbos será, respectivament e,", "alts": ["teve e precisou.", "teve e precisava.", "tinha e precisou.", "tinha e precisava."], "pags": [3]}, {"id": "2026-6", "ano": 2026, "num": 6, "materia": "Português", "topico": "Conjunções e relações de sentido (conectivos)", "dif": "Média", "enun": "Analise o trecho a seguir.\n\n“filhinho tem que entender\nmama áfrica vai e vem\nmas não se afasta de você”\n\nO termo em destaque liga", "alts": ["períodos, introduzindo uma ideia de adição.", "orações, introduzindo uma ideia de oposição.", "orações, introduzindo uma ideia de conclusão.", "períodos, introduzindo uma ideia de explicação."], "pags": [3]}, {"id": "2026-7", "ano": 2026, "num": 7, "materia": "Português", "topico": "Interpretação e inferência (informação explícita e implícita)", "dif": "Média", "enun": "A partir da leitura do trecho, deve-se inferir que", "alts": ["nenhuma mãe abandona os filhos.", "algumas mães abandonam os filhos.", "as mães nunca abandonam os filhos.", "as mães sempre abandonam os filhos. Para responder as questões de 08 a 14, considere o texto reproduzido a seguir. TEXTO 2 Pesquisa aponta que 90% das mulheres que se tornaram mães solos no Brasil, nos últimos dez anos, são negras Segundo a pesquisa do Instituto Brasileiro de Economia, da Fundação Getúlio Vargas (FGV), o número de mães solos no Brasil aumentou na última década. Entre 2012 e 2022, esse número cresceu 1,7 milhão, sendo 90% de mães negras. No Brasil, 11 milhões de mulheres criam seus filhos e filhas sozinhas, sem um pai e, muitas vezes, sem ninguém para ajudá-las, aponta a pesquisa da FGV. Entre elas, 72,4% não têm rede de apoio próximo. Ao todo, as mães solos representam 15% dos lares brasileiros, a maioria na região Norte e Nordeste. O levantamento foi realizado pela pesquisadora Janaína Feijó. “Mais de 50% dessas mães não possuem ensino médio. Geralmente elas tiveram o primeiro filho numa idade muito jovem no momento em que tiveram de interromper os estudos. Então isso tende a afetar a carreira profissional dela para sempre porque ela interrompe os estudos numa fase crucial de acumulação de capital humano”, explicou a pesquisadora. As mães que criam seus filhos sozinhas também estão em desvantagem na renda e no mercado de trabalho. O levantamento mostrou que, no quarto trimestre de 2022, o rendimento mensal de uma mãe solo foi de R$ 2.105,00, enquanto o de um homem casado com filhos foi de R$ 3.438,00, 39% a mais. Em comparação com uma mulher casada com filhos, o rendimento foi de R$ 2.626,00 mensal no quarto trimestre, 20% a mais que uma mãe solo. “Ao contrário das mães solo, a trajetória dos homens no mercado não é afetada após o nascimento dos filhos”, diz Feijó. Mas para uma mãe solo negra o cenário é mais complicado. Diferente de uma mãe solo branca ou amarela, o rendimento mensal das mães que se autodeclaram pretas ou pardas foi de R$ 1.685,00, 39% a menos do que outras mães solos. Para Feijó, o que explica essa diferença na renda das mães é o nível de escolaridade e a idade que tiveram os filhos – apenas 3% das mulheres que tiveram filhos aos 15 anos ou menos possuem ensino superior. Entre as negras, 9% das que criam suas crianças sozinhas possuem ensino superior. A pesquisa ainda revela que 31% das mães solos negras com filhos de diferentes idades estão fora do mercado de trabalho, enquanto as que têm filhos de até cinco anos o número sobe para 34,6. Em comparativo, mães solos brancas e amarelas o número é de 26,6% e 27,5%, respectivamente. “As mães negras tendem a ter filhos mais cedo, e isso retroalimenta a situação desfavorável no mercado de trabalho. Consequentement e, vai repercutir no nível salarial”, comenta a pesquisadora. Disponível em: https://mundonegro.inf.br/pesquisa-aponta-que-90-das-mulheres-que-se-tornaram-maes-solo-no-brasil- nos-ultimos-dez-anos-sao-negras/ [Acesso em: agosto de 2025.]"], "pags": [3, 4]}, {"id": "2026-8", "ano": 2026, "num": 8, "materia": "Português", "topico": "Propósito comunicativo, objetivo e tema do texto", "dif": "Média", "enun": "Considerado em sua totalidade, o objetivo principal do texto é", "alts": ["apresentar dados de um estudo sobre mães solos no Brasil.", "comparar o nível socioeconômico das mães solos e das casadas.", "opinar positivamente sobre a problemática das mães solo no Brasil.", "explicar as dificuldades enfrentadas pelas mães solos negras no Brasil."], "pags": [4]}, {"id": "2026-9", "ano": 2026, "num": 9, "materia": "Português", "topico": "Gêneros textuais", "dif": "Média", "enun": "Considerando as suas características, o texto possui elementos característicos do gênero", "alts": ["notícia.", "crônica.", "reportagem.", "artigo de opinião."], "pags": [4]}, {"id": "2026-10", "ano": 2026, "num": 10, "materia": "Português", "topico": "Organização do texto e função de trecho", "dif": "Média", "enun": "Analise o parágrafo a seguir.\n\nAs mães que criam seus filhos sozinhas também estão em desvantagem na renda e no mercado de\ntrabalho. O levantamento mostrou que, no quarto trimestre de 2022, o rendimento mensal de uma mãe\nsolo foi de R$ 2.105,00, enquanto o de um homem casado com filhos foi de R$ 3.438,00, 39% a mais.\nEm comparação com uma mulher casada com filhos, o rendimento foi de R$ 2.626,00 mensal no quart o\ntrimestre, 20% a mais que uma mãe solo. “Ao contrário das mães solo, a trajetória dos homens no\nmercado não é afetada após o nascimento dos filhos”, diz Feijó.\n\nConsiderando a organização dos períodos, a ideia que resume o parágrafo está localizada no", "alts": ["primeiro período.", "segundo período.", "terceiro período.", "quarto período."], "pags": [5]}, {"id": "2026-11", "ano": 2026, "num": 11, "materia": "Português", "topico": "Acentuação gráfica e ortografia", "dif": "Difícil", "enun": "Leia o período a seguir.\n\nA pesquisa ainda revela que 31% das mães solos negras com filhos de diferentes idades estão fora do\nmercado de trabalho, enquanto as que têm filhos de até cinco anos o número sobe para 34,6.\n\nConsiderando as regras de acentuação gráfica, o verbo “ter” recebeu acento", "alts": ["porque o sujeito se encontra no plural.", "por se tratar de um monossílabo tônico.", "porque o sujeito se encontra no singular.", "por se tratar de uma oxítona terminada em “em”."], "pags": [5]}, {"id": "2026-12", "ano": 2026, "num": 12, "materia": "Português", "topico": "Formação de palavras", "dif": "Difícil", "enun": "Leia o período a seguir.\n\nGeralmente elas tiveram o primeiro filho numa idade muito jovem no momento em que tiveram de\ninterromper os estudos.\n\nO substantivo derivado do verbo \"interromper\" é", "alts": ["interrupsão.", "interrupissão.", "interrupção.", "interrupisção."], "pags": [5]}, {"id": "2026-13", "ano": 2026, "num": 13, "materia": "Português", "topico": "Coesão e coerência (referenciação e pronomes)", "dif": "Difícil", "enun": "Considere o trecho a seguir.\n\nNo Brasil, 11 milhões de mulheres criam seus filhos e filhas sozinhas, sem um pai e, muitas vezes, sem\nninguém para ajudá-las, aponta a pesquisa da FGV.\n\nO termo em destaque é um", "alts": ["um artigo que antecipa uma informação, funcionando como objeto direto.", "um artigo que retoma uma informação, funcionando como objeto indireto.", "um pronome que antecipa uma informação, funcionando como objeto indireto.", "um pronome que retoma uma informação, funcionando como objeto direto."], "pags": [6]}, {"id": "2026-14", "ano": 2026, "num": 14, "materia": "Português", "topico": "Pontuação (vírgula e aspas)", "dif": "Difícil", "enun": "Analise o período a seguir.\n\nMas para uma mãe solo negra o cenário é mais complicado.\n\nConsiderando o uso da pontuação e as normas do português escrito padrão, a nova versão deste período\né:", "alts": ["Mas para uma mãe, solo negra, o cenário é mais complicado.", "Mas, para uma mãe solo negra, o cenário, é mais complicado.", "Mas, para uma mãe solo negra, o cenário é mais complicado.", "Mas para uma mãe, solo, negra, o cenário é mais complicado."], "pags": [6]}, {"id": "2026-15", "ano": 2026, "num": 15, "materia": "Português", "topico": "Comparação entre textos e intertextualidade", "dif": "Difícil", "enun": "Comparando-se o Texto 1 (Mama África) e o Texto 2 (Pesquisa aponta que 90% das mulheres que\nse tornaram mães solos no Brasil, nos últimos dez anos, são negras), ambos apresentam", "alts": ["a mesma temática.", "o mesmo gênero textual.", "o mesmo objetivo principal.", "a mesma sequência textual."], "pags": [6]}, {"id": "2026-16", "ano": 2026, "num": 16, "materia": "Matemática", "topico": "Regra de três (direta e inversa)", "dif": "Fácil", "enun": "Um grupo de turistas visitou os Lençóis Maranhenses e contratou um guia local, que cobra R$ 180,00 por\n6 horas de passeio. Mantendo essa proporção, o valor cobrado por 8 horas e 30 minutos de passeio será\nde", "alts": ["R$ 230,00.", "R$ 249,00.", "R$ 255,00.", "R$ 264,00."], "pags": [7]}, {"id": "2026-17", "ano": 2026, "num": 17, "materia": "Matemática", "topico": "Porcentagem", "dif": "Fácil", "enun": "A produção agrícola do Maranhão, em 2023, foi de 1,2 milhão de toneladas. Em 2024, a produç ão\naumentou 15%. A produção total de 2024, em milhões de toneladas, foi de", "alts": ["1,25.", "1,38.", "1,5.", "1,8."], "pags": [7]}, {"id": "2026-18", "ano": 2026, "num": 18, "materia": "Matemática", "topico": "Sistema de duas equações do 1º grau", "dif": "Fácil", "enun": "Um produtor rural de Imperatriz/MA vendeu um total de 300 quilos de frutas em uma feira, sendo apenas\nmangas e cajus. O preço da ação do 1º grau", "dif": "Média", "enun": "Uma empresa de turismo do Maranhão oferece pacotes para os Lençóis Maranhenses. O pacote inclui\numa taxa fixa de R$ 1.200,00 pelo transporte e R$ 150,00 por turista. Para obter um valor em grupo, a\nempresa decidiu dividir o valor total igualmente entre todos os turistas, de forma que cada um pagou R$\n250,00. O número de turistas que participaram do passeio foi", "alts": ["10.", "12.", "15.", "17."], "pags": [8]}, {"id": "2026-24", "ano": 2026, "num": 24, "materia": "Matemática", "topico": "Múltiplos e divisores (MMC, MDC, divisibilidade, fatores primos)", "dif": "Média", "enun": "Três ônibus partem da rodoviária de São Luís/MA para diferentes cidades. O ônibus A parte a cada 12\nminutos, o ônibus B parte a cada 18 minutos e o ônibus C parte a cada 24 minutos. Se eles partiram\njuntos às 7h30 da manhã, eles partirão juntos novamente às", "alts": ["8h 12min.", "8h 22min.", "8h 30min.", "8h 42min."], "pags": [8]}, {"id": "2026-25", "ano": 2026, "num": 25, "materia": "Matemática", "topico": "Teorema de Pitágoras", "dif": "Média", "enun": "Na cidade de Alcântara/MA há diversas ladeiras históricas que ligam a parte alta da cidade ao porto, às\nmargens do mar. Um estudante decidiu medir o comprimento de uma dessas ladeiras para utilizá-la em\num projeto escolar. Ele verificou que, caminhando, a distância entre o topo da ladeira e o porto é de 130\nmetros, e a diferença de altura entre o nível do mar e o ponto mais alto da ladeira é de 50 metros.\nConsiderando que a ladeira forma um triângulo retângulo com o solo (horizontal) e a altura (vertical), a\ndistância horizontal do topo da ladeira ao porto é de", "alts": ["125 m.", "127 m.", "120 m.", "135 m."], "pags": [8]}, {"id": "2026-26", "ano": 2026, "num": 26, "materia": "Matemática", "topico": "Sistema métrico e unidades de medida (inclui tempo)", "dif": "Difícil", "enun": "A tabela mostra os horários locais de chegada e de partida para dois voos que fazem o trajeto entre duas\  $('#cs',b).onclick=()=>{if(T.run)pause();else{if(!T.dec)T.alvo=alvo0();T.run=1;T.t0=Date.now();T.msg=''}go('cron')};
 $('#cz',b).onclick=()=>{pause();T.dec=0;T.fase='Foco';T.alvo=alvo0();T.msg='';go('cron')};paintRing()}
function viewDesp(b){const d={};Q.forEach(q=>{const r=stat(q);if(r){const k=q.materia+q.topico;d[k]=d[k]||[q.materia,q.topico,0,0,0];d[k][2]++;if(r.ok!=null){d[k][3]++;if(r.ok)d[k][4]++}}});
 const rows=Object.values(d).sort((x,y)=>(x[3]?x[4]/x[3]:2)-(y[3]?y[4]/y[3]:2));
 b.innerHTML=`<div class=cards>${MATS.map(m=>`<div class=card><small>${m} · tempo estudado</small><b>${hms(S.tempo[m])}</b></div>`).join('')}</div><div class=card2><h3>Por assunto <small>(piores primeiro)</small></h3>${rows.map(r=>{const p=r[3]?Math.round(100*r[4]/r[3]):0;return `<div class=bar><span>${esc(r[1])}<br><small>${r[0]} · ${r[2]} resp.</small></span><div class=trk><i style="width:${p}%"></i></div><b>${r[3]?p+'%':'—'}</b></div>`}).join('')||'<p class=mu>Responda questões para ver seu desempenho.</p>'}</div><br><button class=btn id=rs>Zerar progresso</button>`;
 let c=0;$('#rs',b).onclick=e=>{if(!c++){e.target.textContent='Clique de novo para confirmar';return}S.resp={};S.fav=[];S.tempo={'Português':0,'Matemática':0};save();go('desp')}}
const TT=Object.fromEntries(NAV.map(n=>[n[0],n[2]]));
function go(v){V=v;$$('.ni').forEach(n=>n.classList.toggle('on',n.dataset.v===v));$$('#bn button').forEach(n=>n.classList.toggle('on',n.dataset.v===v));$('#main').scrollTop=0;
 $('#main').innerHTML=`<div class=top><button class="btn hb" id=hb>☰</button><h1>${TT[v]}</h1></div><div id=bd></div>`;
 $('#hb').onclick=()=>$('#sd').classList.remove('c');
 ({home,sim:viewSim,cron:viewCron,desp:viewDesp,vid:viewVid}[v]||(x=>viewQ(x,v)))($('#bd'));
 $('#ft').textContent=Object.keys(S.resp).length+' questões respondidas';if(innerWidth<760)$('#sd').classList.add('c')}
$('#nv').innerHTML=NAV.map(n=>`<button class=ni data-v=${n[0]} title="${n[2]}"><span class=ic>${n[1]}</span><span class=lb>${n[2]}</span></button>`).join('');
$$('.ni').forEach(n=>n.onclick=()=>go(n.dataset.v));
if(S.col||innerWidth<760){$('#sd').classList.add('c');$('#tg').textContent='›'}
$('#tg').onclick=()=>{const c=$('#sd').classList.toggle('c');S.col=c?1:0;$('#tg').textContent=c?'›':'‹';save()};
setInterval(()=>{if(T.run&&T.alvo&&tel()>=T.alvo){credit();T.run=0;T.dec=0;
  if(T.modo==='Pomodoro'){T.fase=T.fase==='Foco'?'Pausa':'Foco';T.alvo=alvo0();T.run=1;T.t0=Date.now();T.msg=T.fase==='Foco'?'Hora de focar!':'Pausa de 5 min ☕';try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}}
  else{T.alvo=alvo0();T.msg='Tempo esgotado! ⏰'}if(V==='cron')go('cron')}
 paintRing();if(SIM&&!SIM.done){const r=(SIM.fim-Date.now())/1000,e=$('#simclk');if(e){e.textContent=hms(r);e.style.color=r<300?'var(--er)':''}if(r<=0)finSim()}},300);
go('home');

/* ===== mobile: barra inferior, gaveta, ampliar prova, PWA ===== */
(()=>{const BN=[['home','🏠','Início'],['prov','📚','Provas'],['banco','🗂','Banco'],['sim','📝','Simulado'],['mais','☰','Mais']];
 $('#bn').innerHTML=BN.map(n=>`<button data-v=${n[0]}><span>${n[1]}</span>${n[2]}</button>`).join('');
 $('#bn').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.v==='mais')$('#sd').classList.remove('c');else go(b.dataset.v)};
 $('#bdp').onclick=()=>$('#sd').classList.add('c');
 $$('#bn button').forEach(n=>n.classList.toggle('on',n.dataset.v===V));
 const lb=$('#lbx'),li=$('#lbi'),close=()=>{lb.classList.remove('on','z');document.body.style.overflow=''};
 document.addEventListener('click',e=>{const im=e.target.closest('img.pgi');if(!im)return;li.src=im.src;lb.classList.add('on');lb.classList.remove('z');document.body.style.overflow='hidden'});
 $('#lbc').onclick=close;$('#lbz').onclick=()=>lb.classList.toggle('z');li.onclick=()=>lb.classList.toggle('z');
 addEventListener('keydown',e=>{if(e.key==='Escape'&&lb.classList.contains('on'))close()});
 if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script></body></html>
